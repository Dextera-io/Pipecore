<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 threaded half-coupling, sectioned view</title>
  <desc>Sectioned NPS 2 Class 3000 threaded half-coupling based on ASME B16.11-2021 Tables 6.1-5 and 6.1-3. Dimensions: outside diameter D 76 mm, length W over 2 equal to 43 mm, minimum perfect thread B 19 mm, and minimum effective thread L2 19.2 mm.</desc>

  <rect width="780" height="500" fill="white"/>

  <defs>
    <pattern id="hatchHalfCouplingT" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStartHalfCouplingT" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndHalfCouplingT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>

    <g id="femaleThreadHalfCouplingT">
      <path d="M-90.5,0 L90.5,0 L84,58 L-84,58 Z" fill="white"/>
      <path d="M-90.5,0 L-90,4 L-84,8 L-89,12 L-83,16 L-88,20 L-82,24
               L-87,28 L-81,32 L-86,36 L-80,40 L-85,44 L-79,48 L-84,52 L-84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M90.5,0 L90,4 L84,8 L89,12 L83,16 L88,20 L82,24
               L87,28 L81,32 L86,36 L80,40 L85,44 L79,48 L84,52 L84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="-90.5" y1="0" x2="90.5" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="-84" y1="58" x2="-69" y2="58" stroke="black" stroke-width="1.5"/>
      <line x1="69" y1="58" x2="84" y2="58" stroke="black" stroke-width="1.5"/>
    </g>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Half-Coupling — ASME B16.11</text>

  <!-- Half-coupling body: D=76 mm and W/2=43 mm at 3 px/mm. -->
  <path d="M282,185 L498,185 L504,191 L504,308 L498,314
           L282,314 L276,308 L276,191 Z"
        fill="url(#hatchHalfCouplingT)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Smooth open bore below the threaded portion. -->
  <rect x="321" y="242" width="138" height="74" fill="white"/>
  <line x1="321" y1="242" x2="321" y2="314" stroke="black" stroke-width="1.5"/>
  <line x1="459" y1="242" x2="459" y2="314" stroke="black" stroke-width="1.5"/>
  <line x1="321" y1="243" x2="459" y2="243" stroke="black" stroke-width="1.5"/>
  <line x1="321" y1="314" x2="459" y2="314" stroke="black" stroke-width="1.5"/>

  <!-- Female threaded end. -->
  <use href="#femaleThreadHalfCouplingT" transform="translate(390 185)"/>

  <!-- Centerline. -->
  <line x1="390" y1="158" x2="390" y2="342"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Outside diameter D. -->
  <g fill="none" stroke="black">
    <line x1="276" y1="185" x2="276" y2="124" stroke-width="0.75"/>
    <line x1="504" y1="185" x2="504" y2="124" stroke-width="0.75"/>
    <line x1="276" y1="131" x2="504" y2="131" stroke-width="1"
          marker-start="url(#arrowStartHalfCouplingT)" marker-end="url(#arrowEndHalfCouplingT)"/>
  </g>
  <text x="390" y="124" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">D</text>

  <!-- W/2 and thread lengths B / L2. -->
  <g fill="none" stroke="black">
    <line x1="276" y1="185" x2="53" y2="185" stroke-width="0.75"/>
    <line x1="276" y1="314" x2="53" y2="314" stroke-width="0.75"/>
    <line x1="60" y1="185" x2="60" y2="314" stroke-width="1"
          marker-start="url(#arrowStartHalfCouplingT)" marker-end="url(#arrowEndHalfCouplingT)"/>

    <line x1="300" y1="185" x2="102" y2="185" stroke-width="0.75"/>
    <line x1="306" y1="242.6" x2="102" y2="242.6" stroke-width="0.75"/>
    <line x1="109" y1="185" x2="109" y2="242.6" stroke-width="1"
          marker-start="url(#arrowStartHalfCouplingT)" marker-end="url(#arrowEndHalfCouplingT)"/>
  </g>
  <text x="68" y="255" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">W/2</text>
  <text x="115" y="218" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">L₂</text>

  <g font-size="11" fill="#555">
    <text x="20" y="462">Symmetric sectioned view. Female thread shown in section. ASME B16.11-2021, Tables 6.1-5 and 6.1-3, NPS 2, Class 3000.</text>
    <text x="20" y="480">D=76; W/2=43; B=19 min; L₂=19.2 min. Thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
