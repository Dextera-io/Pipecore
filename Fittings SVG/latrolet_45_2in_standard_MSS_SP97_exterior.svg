<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>2 inch Standard 45-degree Buttwelding Outlet, MSS SP-97</title>
  <desc>Exterior elevation of an NPS 2 Standard 45-degree buttwelding branch outlet fitting based on MSS SP-97-2025 Table 5. Dimension A, top of fitting to run pipe, ranges from 2.88 inches minimum to 3.50 inches maximum. The inclined butt-weld bevel and curved run-pipe saddle are shown.</desc>

  <rect width="760" height="353" fill="white"/>

  <defs>
    <linearGradient id="weld45BodyFill" gradientUnits="userSpaceOnUse" x1="235" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#b4bfca"/>
      <stop offset="0.25" stop-color="#dbe2e9"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="0.80" stop-color="#d3dbe3"/>
      <stop offset="1" stop-color="#a9b5c1"/>
    </linearGradient>
    <linearGradient id="weld45BevelFill" gradientUnits="userSpaceOnUse" x1="405" y1="85" x2="488" y2="132">
      <stop offset="0" stop-color="#dce3ea"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#98a4b0"/>
    </linearGradient>
    <linearGradient id="weld45SaddleFill" gradientUnits="userSpaceOnUse" x1="0" y1="248" x2="0" y2="300">
      <stop offset="0" stop-color="#dce3ea"/>
      <stop offset="1" stop-color="#8f9aa6"/>
    </linearGradient>
    <marker id="weld45ArrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="weld45ArrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="22" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Standard 45&#176; Weldolet &#8212; MSS SP-97</text>

  <g transform="translate(0 12)">
    <!-- Forged 45-degree buttwelding outlet body. -->
    <path d="M235,248
             L320,155
             L438,118
             L503,183
             C508,204 509,229 505,248
             Q370,264 235,248 Z"
          fill="url(#weld45BodyFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- Lighter forward facet, matching the successful threaded-outlet geometry. -->
    <path d="M235,248
             L320,155
             L505,248
             Q370,264 235,248 Z"
          fill="#f7f9fb" fill-opacity="0.78" stroke="#747e88" stroke-width="0.85"
          stroke-linejoin="round"/>

    <!-- Butt-weld bevel at the inclined branch end. -->
    <path d="M438,118 L456,100 L521,165 L503,183 Z"
          fill="url(#weld45BevelFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
    <line x1="451" y1="105" x2="516" y2="170" stroke="#6f7882" stroke-width="0.9"/>

    <!-- Curved saddle that follows the run pipe. -->
    <path d="M235,248
             Q370,268 505,248
             L488,270
             Q370,301 252,270
             Z"
          fill="url(#weld45SaddleFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- Axis centered on both the branch face and the run-pipe contact point. -->
    <line x1="300" y1="320" x2="535" y2="85"
          stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

    <!-- A: top of fitting to run pipe, parallel to the fitting axis. -->
    <line x1="400" y1="43" x2="280" y2="163" stroke="black" stroke-width="1"
          marker-start="url(#weld45ArrowStart)" marker-end="url(#weld45ArrowEnd)"/>
    <line x1="400" y1="43" x2="489" y2="132" stroke="black" stroke-width="0.75"/>
    <line x1="280" y1="163" x2="370" y2="253" stroke="black" stroke-width="0.75"/>
    <text x="322" y="103" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">A</text>
  </g>
</svg>
