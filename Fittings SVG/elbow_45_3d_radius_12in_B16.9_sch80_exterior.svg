<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>12 inch ASME B16.9 Schedule 80 3D-radius 45-degree elbow</title>
  <desc>Exterior view of a proportional NPS 12 3D-radius 45-degree elbow based on ASME B16.9-2024 Table 6.1-6: outside diameter 323.8 mm and center-to-end dimension B=378 mm. Both ends use integrated Schedule 80 bevels. The curved edges are gray and the red centerline is the lightest part of the radial gradient.</desc>

  <rect x="0" y="0" width="760" height="353" fill="white"/>

  <defs>
    <radialGradient id="bodyFill" gradientUnits="userSpaceOnUse"
                    cx="250" cy="315" r="240" fx="250" fy="315">
      <stop offset="0" stop-color="#93a3b4"/>
      <stop offset="0.6991" stop-color="#93a3b4"/>
      <stop offset="0.76" stop-color="#cbd5df"/>
      <stop offset="0.815" stop-color="#eef2f6"/>
      <stop offset="0.8495" stop-color="#ffffff"/>
      <stop offset="0.89" stop-color="#eef2f6"/>
      <stop offset="0.945" stop-color="#cbd5df"/>
      <stop offset="1" stop-color="#93a3b4"/>
    </radialGradient>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="365" y="22" text-anchor="middle" font-size="17" font-weight="bold">12&quot; 45&#176; 3D Radius Elbow &#8212; ASME B16.9</text>

  <!-- Continuous exterior contour with integrated Schedule 80 bevels. -->
  <path d="M 250,78.54
           L 254.62,75
           C 313.65,75 374.70,100.29 416.44,142.03
           L 417.20,147.80
           L 371.14,193.86
           L 365.37,193.09
           C 333.90,161.62 299.12,147.22 254.62,147.22
           L 250,143.68
           Z"
        fill="url(#bodyFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Tangent construction lines. -->
  <line x1="220" y1="111.11" x2="375" y2="111.11" stroke="black" stroke-width="0.75"/>
  <line x1="310" y1="86.79" x2="412" y2="188.79" stroke="black" stroke-width="0.75"/>

  <!-- Elbow centerline. -->
  <path d="M 250,111.11 A 203.89,203.89 0 0 1 394.17,170.83"
        fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- B: center-to-end dimension along the inlet tangent. -->
  <line x1="250" y1="78.54" x2="250" y2="55" stroke="black" stroke-width="0.75"/>
  <line x1="334.32" y1="111.11" x2="334.32" y2="55" stroke="black" stroke-width="0.75"/>
  <line x1="250" y1="55" x2="334.32" y2="55" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="292.16" y="50" text-anchor="middle" font-size="15" font-weight="bold">B</text>

  <!-- B: matching center-to-end dimension along the inclined outlet tangent. -->
  <line x1="334.32" y1="111.11" x2="380.28" y2="65.15" stroke="black" stroke-width="0.75"/>
  <line x1="394.17" y1="170.83" x2="440.13" y2="124.87" stroke="black" stroke-width="0.75"/>
  <line x1="380.28" y1="65.15" x2="440.13" y2="124.87" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="418" y="86" text-anchor="middle" font-size="15" font-weight="bold"
        transform="rotate(45 418 86)">B</text>
</svg>
