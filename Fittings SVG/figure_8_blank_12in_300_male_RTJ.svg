<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" font-family="Arial, sans-serif">
  <title>12 inch Class 300 Male RTJ Figure-8 blank</title>
  <desc>Top view based on ASME B16.48-2025 Table 5.1-8: B 324 mm, A 450 mm, t 35.1 mm, and W 121 mm. Section thickness is normalized to the Female RTJ drawing for visual consistency. Male ring-joint projections are shown schematically without a raised face.</desc>

  <rect width="840" height="580" fill="white"/>

  <defs>
    <linearGradient id="steelFace" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="0.28" stop-color="#c7d1da"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="0.82" stop-color="#b9c5cf"/>
      <stop offset="1" stop-color="#e5ebf0"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#e7edf2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4b5563" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="#111827"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>

  <text x="420" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">12&quot; Class 300 Male RTJ Figure-8 Blank</text>
  <text x="420" y="45" text-anchor="middle" font-size="12" fill="#4b5563">ASME B16.48-2025, Table 5.1-8</text>

  <!-- Top view. The outer envelope is illustrative because Table 5.1-8 does not specify O. -->
  <g id="top-view">
    <!-- Curved web follows the outside profiles of both circular ends. -->
    <path d="M347.15 151.44
             L386.85 151.44
             A148.68 148.68 0 0 0 386.85 238.56
             L347.15 238.56
             A148.68 148.68 0 0 0 347.15 151.44 Z"
          fill="url(#steelFace)" stroke="#111827" stroke-width="1.6"/>

    <circle cx="205" cy="195" r="148.68" fill="url(#steelFace)" stroke="#111827" stroke-width="1.8"/>
    <circle cx="205" cy="195" r="116.64" fill="white" stroke="#111827" stroke-width="1.8"/>

    <circle cx="529" cy="195" r="148.68" fill="url(#steelFace)" stroke="#111827" stroke-width="1.8"/>
    <circle cx="529" cy="195" r="116.64" fill="none" stroke="#111827" stroke-width="1.2"/>

    <circle cx="367" cy="195" r="2.52" fill="white" stroke="#111827" stroke-width="1.3"/>

    <g stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4">
      <line x1="36" y1="195" x2="698" y2="195"/>
      <line x1="205" y1="27" x2="205" y2="363"/>
      <line x1="529" y1="27" x2="529" y2="363"/>
    </g>

    <line x1="356" y1="151.44" x2="374" y2="151.44" stroke="#111827" stroke-width="0.8"/>
    <line x1="356" y1="238.56" x2="374" y2="238.56" stroke="#111827" stroke-width="0.8"/>
    <line x1="370" y1="151.44" x2="370" y2="238.56" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <text x="380" y="199" font-size="15" font-style="italic" font-weight="bold">W</text>

    <line x1="205" y1="343.68" x2="205" y2="384" stroke="#111827" stroke-width="0.8"/>
    <line x1="529" y1="343.68" x2="529" y2="384" stroke="#111827" stroke-width="0.8"/>
    <line x1="205" y1="376" x2="529" y2="376" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <rect x="357" y="365" width="20" height="16" fill="white"/>
    <text x="367" y="377" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">A</text>
  </g>

  <!-- Lateral section with male RTJ projections; no raised face. -->
  <g id="section-view">
    <!-- Base plate, thickness t = 35.1 mm. -->
    <rect x="56.32" y="452" width="32.04" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>
    <rect x="321.64" y="452" width="32.04" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>
    <rect x="380.32" y="452" width="297.36" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>

    <!-- Male RTJ annular projections, shown as rounded section lobes. -->
    <g fill="url(#hatch)" stroke="#111827" stroke-width="1.5">
      <ellipse cx="72" cy="470.29" rx="10.5" ry="23"/>
      <ellipse cx="338" cy="470.29" rx="10.5" ry="23"/>
      <ellipse cx="396" cy="470.29" rx="10.5" ry="23"/>
      <ellipse cx="662" cy="470.29" rx="10.5" ry="23"/>
    </g>

    <!-- Reduced web thickness and identification hole. -->
    <rect x="353.68" y="463.5" width="26.64" height="13.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.5"/>
    <rect x="364.48" y="462.7" width="5.04" height="15.18" fill="white" stroke="#111827" stroke-width="1.2"/>

    <!-- Visible bore limits in the lateral view. -->
    <line x1="88.36" y1="452" x2="321.64" y2="452" stroke="#111827" stroke-width="1.2"/>
    <line x1="88.36" y1="488.58" x2="321.64" y2="488.58" stroke="#111827" stroke-width="1.2"/>

    <g stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4">
      <line x1="205" y1="411" x2="205" y2="512"/>
      <line x1="529" y1="411" x2="529" y2="512"/>
    </g>

    <!-- B above the section. O is not specified in the Male RTJ table. -->
    <line x1="88.36" y1="452" x2="88.36" y2="426" stroke="#111827" stroke-width="0.8"/>
    <line x1="321.64" y1="452" x2="321.64" y2="426" stroke="#111827" stroke-width="0.8"/>
    <line x1="88.36" y1="432" x2="321.64" y2="432" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <rect x="195" y="421" width="20" height="16" fill="white"/>
    <text x="205" y="433" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">B</text>

    <!-- Base thickness t and total male-facing height Th. -->
    <line x1="677.68" y1="452" x2="715" y2="452" stroke="#111827" stroke-width="0.8"/>
    <line x1="677.68" y1="488.58" x2="715" y2="488.58" stroke="#111827" stroke-width="0.8"/>
    <line x1="707" y1="452" x2="707" y2="488.58" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <text x="718" y="475" font-size="15" font-style="italic" font-weight="bold">t</text>

    <line x1="672.5" y1="447.29" x2="755" y2="447.29" stroke="#111827" stroke-width="0.8"/>
    <line x1="672.5" y1="493.29" x2="755" y2="493.29" stroke="#111827" stroke-width="0.8"/>
    <line x1="747" y1="447.29" x2="747" y2="493.29" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <text x="758" y="475" font-size="15" font-style="italic" font-weight="bold">T<tspan baseline-shift="sub" font-size="11">h</tspan></text>
  </g>

  <text x="367" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">TOP VIEW</text>
  <text x="367" y="522" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">SECTION VIEW</text>

  <g font-size="11.5" fill="#4b5563">
    <text x="28" y="550">Dimensions: B = 324 mm (12.75 in.); A = 450 mm (17.75 in.); t = 35.1 mm (1.38 in.).</text>
    <text x="28" y="568">W = 121 mm (4.75 in.). Male RTJ projection and total height Th are shown schematically.</text>
  </g>
</svg>
