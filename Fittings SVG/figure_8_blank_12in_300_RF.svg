<svg xmlns="http://www.w3.org/2000/svg" width="840" height="580" viewBox="0 0 840 580" font-family="Arial, sans-serif">
  <title>12 inch Class 300 Figure-8 blank for raised face flanges</title>
  <desc>Top view based on ASME B16.48-2025 Table 4.3.1-2: B 324 mm, O 419 mm, A 450 mm, t 28.4 mm, and W 102 mm. Section thickness is normalized to the Female RTJ drawing for visual consistency and includes 1.5 mm raised faces for Class 300 flanges.</desc>

  <rect x="0" y="0" width="840" height="580" fill="white"/>

  <defs>
    <linearGradient id="steelFace" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="0.28" stop-color="#c7d1da"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="0.82" stop-color="#b9c5cf"/>
      <stop offset="1" stop-color="#e5ebf0"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#e7edf2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4b5563" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="#111827"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>

  <text x="420" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">12&quot; Class 300 Figure-8 Blank (Spectacle Blind) &#8212; RF</text>
  <text x="420" y="45" text-anchor="middle" font-size="12" fill="#4b5563">ASME B16.48-2025, Table 4.3.1-2</text>

  <!-- Top view. Geometry scale: 0.72 px/mm. -->
  <g id="top-view">
    <!-- Connecting web, placed behind both circular ends. -->
    <rect x="351.30" y="164.28" width="31.40" height="73.44" fill="url(#steelFace)" stroke="#111827" stroke-width="1.6"/>

    <!-- Open end. -->
    <circle cx="205" cy="201" r="150.84" fill="url(#steelFace)" stroke="#111827" stroke-width="1.8"/>
    <circle cx="205" cy="201" r="116.64" fill="white" stroke="#111827" stroke-width="1.8"/>

    <!-- Blank end. -->
    <circle cx="529" cy="201" r="150.84" fill="url(#steelFace)" stroke="#111827" stroke-width="1.8"/>

    <!-- Identification hole in the web, proportional to the 7 mm reference detail. -->
    <circle cx="367" cy="201" r="2.52" fill="white" stroke="#111827" stroke-width="1.3"/>

    <!-- Centerlines. -->
    <g stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4">
      <line x1="34" y1="201" x2="700" y2="201"/>
      <line x1="205" y1="31" x2="205" y2="371"/>
      <line x1="529" y1="31" x2="529" y2="371"/>
    </g>

    <!-- W: web width. -->
    <line x1="356" y1="164.28" x2="374" y2="164.28" stroke="#111827" stroke-width="0.8"/>
    <line x1="356" y1="237.72" x2="374" y2="237.72" stroke="#111827" stroke-width="0.8"/>
    <line x1="370" y1="164.28" x2="370" y2="237.72" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <text x="380" y="205" font-size="15" font-style="italic" font-weight="bold">W</text>

    <!-- A: center-to-center dimension. -->
    <line x1="205" y1="351.84" x2="205" y2="384" stroke="#111827" stroke-width="0.8"/>
    <line x1="529" y1="351.84" x2="529" y2="384" stroke="#111827" stroke-width="0.8"/>
    <line x1="205" y1="376" x2="529" y2="376" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <rect x="357" y="365" width="20" height="16" fill="white"/>
    <text x="367" y="377" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">A</text>
  </g>

  <!-- Longitudinal section through both centerlines. -->
  <g id="section-view">
    <!-- Open end appears as two cut blocks. -->
    <rect x="54.16" y="452" width="34.20" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>
    <rect x="321.64" y="452" width="34.20" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>

    <!-- Web and solid blank end. -->
    <rect x="355.84" y="452" width="26.86" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>
    <rect x="382.70" y="452" width="297.14" height="36.58" fill="url(#hatch)" stroke="#111827" stroke-width="1.6"/>

    <!-- 1.5 mm raised faces on both sealing sides. RF diameter = 381 mm. -->
    <g fill="#d7e0e7" stroke="#111827" stroke-width="1">
      <!-- Open annular end. -->
      <rect x="67.84" y="450.92" width="20.52" height="1.08"/>
      <rect x="321.64" y="450.92" width="20.52" height="1.08"/>
      <rect x="67.84" y="488.58" width="20.52" height="1.08"/>
      <rect x="321.64" y="488.58" width="20.52" height="1.08"/>

      <!-- Solid blank end. -->
      <rect x="391.84" y="450.92" width="274.32" height="1.08"/>
      <rect x="391.84" y="488.58" width="274.32" height="1.08"/>
    </g>

    <!-- Web identification hole in section. -->
    <rect x="364.48" y="451.2" width="5.04" height="38.18" fill="white" stroke="#111827" stroke-width="1.2"/>

    <!-- Visible limits of the open bore in the real lateral view. -->
    <g stroke="#111827" stroke-width="1.2">
      <line x1="88.36" y1="452" x2="321.64" y2="452"/>
      <line x1="88.36" y1="488.58" x2="321.64" y2="488.58"/>
    </g>

    <!-- Section centerlines. -->
    <g stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4">
      <line x1="205" y1="414" x2="205" y2="501"/>
      <line x1="529" y1="414" x2="529" y2="501"/>
    </g>

    <!-- O and B dimensions above the section. -->
    <line x1="54.16" y1="452" x2="54.16" y2="414" stroke="#111827" stroke-width="0.8"/>
    <line x1="355.84" y1="452" x2="355.84" y2="414" stroke="#111827" stroke-width="0.8"/>
    <line x1="54.16" y1="420" x2="355.84" y2="420" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <rect x="195" y="409" width="20" height="16" fill="white"/>
    <text x="205" y="421" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">O</text>

    <line x1="88.36" y1="452" x2="88.36" y2="431" stroke="#111827" stroke-width="0.8"/>
    <line x1="321.64" y1="452" x2="321.64" y2="431" stroke="#111827" stroke-width="0.8"/>
    <line x1="88.36" y1="437" x2="321.64" y2="437" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <rect x="195" y="426" width="20" height="16" fill="white"/>
    <text x="205" y="438" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">B</text>

    <!-- t: plate thickness. -->
    <line x1="679.84" y1="452" x2="715" y2="452" stroke="#111827" stroke-width="0.8"/>
    <line x1="679.84" y1="488.58" x2="715" y2="488.58" stroke="#111827" stroke-width="0.8"/>
    <line x1="707" y1="452" x2="707" y2="488.58" stroke="#111827" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <text x="718" y="475" font-size="15" font-style="italic" font-weight="bold">t</text>
  </g>

  <text x="367" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">TOP VIEW</text>
  <text x="367" y="522" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">SECTION VIEW</text>

  <g font-size="11.5" fill="#4b5563">
    <text x="28" y="550">Dimensions: B = 324 mm (12.75 in.); O = 419 mm (16.50 in.); A = 450 mm (17.75 in.).</text>
    <text x="28" y="568">t = 28.4 mm (1.12 in.); W = 102 mm (4.00 in.); raised face = 1.5 mm (0.06 in.), both sides.</text>
  </g>
</svg>
