<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 threaded tee, sectioned view</title>
  <desc>Symmetrical sectioned NPS 2 Class 3000 threaded tee based on ASME B16.11-2021 Table 6.1-3. Dimensions: A 64 mm minimum, H 84 mm minimum, G 7.14 mm minimum, B 19 mm minimum, and L2 19.2 mm minimum.</desc>

  <rect width="780" height="580" fill="white"/>

  <defs>
    <pattern id="hatchTeeT" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <pattern id="hatchTeeTSide" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(-45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStartTeeT" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndTeeT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>

    <g id="femaleThreadTeeT">
      <path d="M-90.5,0 L90.5,0 L84,58 L-84,58 Z" fill="white"/>
      <path d="M-90.5,0 L-90,4 L-84,8 L-89,12 L-83,16 L-88,20 L-82,24
               L-87,28 L-81,32 L-86,36 L-80,40 L-85,44 L-79,48 L-84,52 L-84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M90.5,0 L90,4 L84,8 L89,12 L83,16 L88,20 L82,24
               L87,28 L81,32 L86,36 L80,40 L85,44 L79,48 L84,52 L84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="-90.5" y1="0" x2="90.5" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="-84" y1="58" x2="-69" y2="58" stroke="black" stroke-width="1.5"/>
      <line x1="69" y1="58" x2="84" y2="58" stroke="black" stroke-width="1.5"/>
    </g>

    <g id="outerBandTeeT">
      <path d="M-126,0 L126,0 L126,58 C126,70 116,80 105,80
               L-105,80 C-116,80 -126,70 -126,58 Z"
            fill="url(#hatchTeeT)"/>
      <path d="M-105,80 C-116,80 -126,70 -126,58 L-126,0 L126,0 L126,58
               C126,70 116,80 105,80"
            fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
    </g>
    <g id="outerBandTeeTSide">
      <path d="M-126,0 L126,0 L126,58 C126,70 116,80 105,80
               L-105,80 C-116,80 -126,70 -126,58 Z"
            fill="url(#hatchTeeTSide)"/>
      <path d="M-105,80 C-116,80 -126,70 -126,58 L-126,0 L126,0 L126,58
               C126,70 116,80 105,80"
            fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
    </g>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Tee — ASME B16.11</text>

  <!-- Central body, scale 3 px/mm. -->
  <path d="M268,310 L512,310 M390,188 L390,310"
        fill="none" stroke="black" stroke-width="210" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M268,310 L512,310 M390,188 L390,310"
        fill="none" stroke="url(#hatchTeeT)" stroke-width="206" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Full-diameter threaded bands with reduced body transitions. -->
  <use href="#outerBandTeeT" transform="translate(390 118)"/>
  <use href="#outerBandTeeTSide" transform="translate(198 310) rotate(-90)"/>
  <use href="#outerBandTeeTSide" transform="translate(582 310) rotate(90)"/>
  <!-- Clean union between the branch and run; no contour remains inside the material. -->
  <rect x="258" y="174" width="34" height="44" fill="url(#hatchTeeT)"/>
  <rect x="488" y="174" width="34" height="44" fill="url(#hatchTeeT)"/>
  <g fill="none" stroke="black" stroke-width="1.75">
    <path d="M264,118 L264,184 L198,184"/>
    <path d="M516,118 L516,184 L582,184"/>
  </g>

  <!-- Continuous T-shaped internal passage. -->
  <path d="M256,310 L524,310 M390,176 L390,310"
        fill="none" stroke="black" stroke-width="142" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M256,310 L524,310 M390,176 L390,310"
        fill="none" stroke="white" stroke-width="138" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Female threaded ends. -->
  <use href="#femaleThreadTeeT" transform="translate(390 118)"/>
  <use href="#femaleThreadTeeT" transform="translate(198 310) rotate(-90)"/>
  <use href="#femaleThreadTeeT" transform="translate(582 310) rotate(90)"/>

  <!-- Centerlines. -->
  <path d="M390,92 L390,334 M172,310 L608,310"
        fill="none" stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- H across upper band. -->
  <g fill="none" stroke="black">
    <line x1="264" y1="118" x2="264" y2="59" stroke-width="0.75"/>
    <line x1="516" y1="118" x2="516" y2="59" stroke-width="0.75"/>
    <line x1="264" y1="66" x2="516" y2="66" stroke-width="1"
          marker-start="url(#arrowStartTeeT)" marker-end="url(#arrowEndTeeT)"/>
  </g>
  <text x="390" y="59" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">H</text>

  <!-- Center-to-end A (broken line with gap for label). -->
  <g fill="none" stroke="black">
    <line x1="264" y1="118" x2="30" y2="118" stroke-width="0.75"/>
    <line x1="198" y1="310" x2="30" y2="310" stroke-width="0.75"/>
    <line x1="37" y1="118" x2="37" y2="195" stroke-width="1"
          marker-start="url(#arrowStartTeeT)"/>
    <line x1="37" y1="235" x2="37" y2="310" stroke-width="1"
          marker-end="url(#arrowEndTeeT)"/>
  </g>
  <text x="5" y="220" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">A</text>

  <!-- Thread engagement length L2. -->
  <g fill="none" stroke="black">
    <line x1="300" y1="118" x2="102" y2="118" stroke-width="0.75"/>
    <line x1="306" y1="175.6" x2="102" y2="175.6" stroke-width="0.75"/>
    <line x1="109" y1="118" x2="109" y2="175.6" stroke-width="1"
          marker-start="url(#arrowStartTeeT)" marker-end="url(#arrowEndTeeT)"/>
  </g>
  <text x="115" y="151" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">L₂</text>

  <!-- Minimum body wall G. -->
  <g fill="none" stroke="black">
    <line x1="390" y1="459" x2="390" y2="413" stroke-width="1"
          marker-end="url(#arrowEndTeeT)"/>
  </g>
  <text x="390" y="478" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">G</text>

  <g font-size="11" fill="#555">
    <text x="20" y="542">Symmetric sectioned view. Female threads shown in section. ASME B16.11-2021, Table 6.1-3, NPS 2, Class 3000.</text>
    <text x="20" y="560">A=64 min; H=84 min; G=7.14 min; B=19 min; L₂=19.2 min. Thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
