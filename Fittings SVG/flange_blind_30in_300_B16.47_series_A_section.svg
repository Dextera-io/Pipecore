<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>30 inch Class 300 ASME B16.47 Series A blind flange, sectioned view</title>
  <desc>Proportional section based on ASME B16.47 Series A: O 1092 mm, W 997 mm, bolt hole 1-7/8 inch, blind flange tf 93.7 mm, raised-face diameter R 857 mm, and raised-face height 1.5 mm.</desc>

  <rect x="0" y="0" width="760" height="353" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="355.35" y="24" text-anchor="middle" font-size="18" font-weight="bold">30&quot; Class 300 ASME B16.47 Series A Blind Flange &#8212; Sectioned View</text>

  <!-- Sectioned blind body; raised face oriented down. -->
  <path d="M 100.85,193.82
           Q 94.85,193.82 94.85,199.82
           L 94.85,238.52
           L 150.91,238.52
           L 150.91,239.24
           L 559.79,239.24
           L 559.79,238.52
           L 615.85,238.52
           L 615.85,199.82
           Q 615.85,193.82 609.85,193.82
           Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.5"/>

  <!-- Diametrically opposed bolt holes on the 997 mm bolt circle. -->
  <rect x="106.15" y="193.82" width="22.72" height="44.70" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="581.83" y="193.82" width="22.72" height="44.70" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Center line. -->
  <line x1="355.35" y1="50" x2="355.35" y2="315" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- O: flange outside diameter. -->
  <line x1="94.85" y1="199.82" x2="94.85" y2="112" stroke="black" stroke-width="0.75"/>
  <line x1="615.85" y1="199.82" x2="615.85" y2="112" stroke="black" stroke-width="0.75"/>
  <line x1="94.85" y1="120" x2="615.85" y2="120" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="355.35" y="115" text-anchor="middle" font-size="15" font-weight="bold">O</text>

  <!-- tf: blind-flange thickness, excluding the raised face. -->
  <line x1="609.85" y1="193.82" x2="640" y2="193.82" stroke="black" stroke-width="0.75"/>
  <line x1="615.85" y1="238.52" x2="640" y2="238.52" stroke="black" stroke-width="0.75"/>
  <line x1="638" y1="193.82" x2="638" y2="238.52" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="647" y="220.7" text-anchor="start" font-size="15" font-weight="bold">tf</text>

  <!-- W: bolt-circle diameter. -->
  <line x1="117.51" y1="238.52" x2="117.51" y2="278" stroke="black" stroke-width="0.75"/>
  <line x1="593.19" y1="238.52" x2="593.19" y2="278" stroke="black" stroke-width="0.75"/>
  <line x1="117.51" y1="270" x2="593.19" y2="270" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="355.35" y="265" text-anchor="middle" font-size="15" font-weight="bold">W</text>

  <g font-size="11" fill="#555">
    <text x="20" y="329">Geometría proporcional basada en ASME B16.47 Serie A.</text>
    <text x="20" y="345">O=1092; W=997; tf=93.7; R=857 mm; raised face de 1.5 mm; 28 agujeros Ø1-7/8&quot;.</text>
  </g>
</svg>
