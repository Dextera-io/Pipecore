<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 threaded couplet, sectioned view</title>
  <desc>NPS 2 Class 3000 threaded couplet based on ASME B16.11-2021 Tables 6.1-5 and 6.1-3. Uniform scale 3 px/mm. E 79.4 mm, M 51 mm, Q 9.5 mm, N 61.9 mm, minimum perfect thread B 19 mm, and minimum effective thread L2 19.2 mm.</desc>

  <rect width="780" height="500" fill="white"/>

  <defs>
    <pattern id="hatchCoupletT" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStartCoupletT" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndCoupletT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <g id="femaleThreadCoupletT">
      <path d="M-90.5,0 L90.5,0 L84,58 L-84,58 Z" fill="white"/>
      <path d="M-90.5,0 L-90,4 L-84,8 L-89,12 L-83,16 L-88,20 L-82,24
               L-87,28 L-81,32 L-86,36 L-80,40 L-85,44 L-79,48 L-84,52 L-84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M90.5,0 L90,4 L84,8 L89,12 L83,16 L88,20 L82,24
               L87,28 L81,32 L86,36 L80,40 L85,44 L79,48 L84,52 L84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="-90.5" y1="0" x2="90.5" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="-84" y1="58" x2="-69" y2="58" stroke="black" stroke-width="1.5"/>
      <line x1="69" y1="58" x2="84" y2="58" stroke="black" stroke-width="1.5"/>
    </g>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Couplet — ASME B16.11</text>

  <!-- E=79.4 mm, M=51 mm, N=61.9 mm. Transition placed below the thread. -->
  <path d="M276.9,151 L503.1,151
           L509.1,157 L509.1,226
           L482.85,252.25 L482.85,298
           L476.85,304 L303.15,304
           L297.15,298 L297.15,252.25
           L270.9,226 L270.9,157 Z"
        fill="url(#hatchCoupletT)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Smooth open bore below the threaded portion. -->
  <rect x="321" y="209" width="138" height="96" fill="white"/>
  <line x1="321" y1="209" x2="321" y2="304" stroke="black" stroke-width="1.5"/>
  <line x1="459" y1="209" x2="459" y2="304" stroke="black" stroke-width="1.5"/>
  <line x1="321" y1="304" x2="459" y2="304" stroke="black" stroke-width="1.5"/>

  <use href="#femaleThreadCoupletT" transform="translate(390 151)"/>
  <line x1="321" y1="209" x2="459" y2="209" stroke="black" stroke-width="1.75"/>

  <line x1="390" y1="124" x2="390" y2="337"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Top E. -->
  <g fill="none" stroke="black">
    <line x1="270.9" y1="157" x2="270.9" y2="55" stroke-width="0.75"/>
    <line x1="509.1" y1="157" x2="509.1" y2="55" stroke-width="0.75"/>
    <line x1="270.9" y1="62" x2="509.1" y2="62" stroke-width="1"
          marker-start="url(#arrowStartCoupletT)" marker-end="url(#arrowEndCoupletT)"/>
  </g>
  <text x="390" y="55" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">E</text>

  <!-- Thread lengths B / L2. -->
  <g fill="none" stroke="black">
    <line x1="300" y1="151" x2="102" y2="151" stroke-width="0.75"/>
    <line x1="306" y1="208.6" x2="102" y2="208.6" stroke-width="0.75"/>
    <line x1="109" y1="151" x2="109" y2="208.6" stroke-width="1"
          marker-start="url(#arrowStartCoupletT)" marker-end="url(#arrowEndCoupletT)"/>
  </g>
  <text x="115" y="184" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">L₂</text>

  <!-- Overall M and weld-ring Q. Q arrow at x=556; M arrow at x=620. -->
  <!-- M bottom witness drawn in two segments to leave a gap around the Q arrow. -->
  <g fill="none" stroke="black">
    <line x1="509.1" y1="151" x2="697" y2="151" stroke-width="0.75"/>
    <line x1="482.85" y1="304" x2="548" y2="304" stroke-width="0.75"/>
    <line x1="564" y1="304" x2="697" y2="304" stroke-width="0.75"/>
    <line x1="690" y1="151" x2="690" y2="304" stroke-width="1"
          marker-start="url(#arrowStartCoupletT)" marker-end="url(#arrowEndCoupletT)"/>

    <line x1="482.85" y1="252.25" x2="563" y2="252.25" stroke-width="0.75"/>
    <line x1="482.85" y1="304" x2="563" y2="304" stroke-width="0.75"/>
    <line x1="556" y1="252.25" x2="556" y2="304" stroke-width="1"
          marker-start="url(#arrowStartCoupletT)" marker-end="url(#arrowEndCoupletT)"/>
  </g>
  <text x="698" y="232" font-size="15" font-style="italic" font-weight="bold">M</text>
  <text x="568" y="283" font-size="15" font-style="italic" font-weight="bold">Q</text>

  <!-- N across the lower weld ring. -->
  <g fill="none" stroke="black">
    <line x1="297.15" y1="304" x2="297.15" y2="356" stroke-width="0.75"/>
    <line x1="482.85" y1="304" x2="482.85" y2="356" stroke-width="0.75"/>
    <line x1="297.15" y1="349" x2="482.85" y2="349" stroke-width="1"
          marker-start="url(#arrowStartCoupletT)" marker-end="url(#arrowEndCoupletT)"/>
  </g>
  <text x="390" y="343" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">N</text>

  <!-- 45-degree transition callout. -->
  <path d="M222,249 L276,241" fill="none" stroke="black" stroke-width="1"
        marker-end="url(#arrowEndCoupletT)"/>
  <text x="151" y="239" font-size="13" font-weight="bold">45° ± 2.5°</text>

  <g font-size="11" fill="#555">
    <text x="20" y="462">Symmetric sectioned view. Female thread shown in section. ASME B16.11-2021, Tables 6.1-5 and 6.1-3, NPS 2, Class 3000.</text>
    <text x="20" y="480">E=79.4; M=51; N=61.9; Q=9.5; B=19 min; L₂=19.2 min. Thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
