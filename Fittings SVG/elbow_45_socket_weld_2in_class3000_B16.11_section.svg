<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 socket-welding 45-degree elbow, sectioned view</title>
  <desc>Symmetrical sectioned NPS 2 Class 3000 socket-welding 45-degree elbow based on ASME B16.11-2021 Table 6.1-1. Dimensions: A 25.5 mm minimum, socket bore B 61.2 to 61.7 mm, socket wall C 6.93 mm average and 6.04 mm minimum, fitting bore D 51.7 to 53.3 mm, body wall G 5.54 mm minimum, and socket depth J 16 mm minimum.</desc>

  <rect width="760" height="500" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="23" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Socket Weld 45° Elbow — ASME B16.11</text>

  <!--
    Uniform drawing scale: 3 px/mm, identical to the 90-degree elbow.
    B and D use the midpoint of their ASME limit ranges.
  -->

  <!-- Bottom socket body. -->
  <path d="M 187.04,356.50 L 412.97,356.50 L 412.97,404.50 L 187.04,404.50 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>

  <!-- 45-degree socket body; local X is the socket axis. -->
  <g transform="translate(354.09 225.91) rotate(-45)">
    <path d="M 0,-112.97 L 48,-112.97 L 48,112.97 L 0,112.97 Z"
          fill="url(#hatch)" stroke="black" stroke-width="1.75"/>
  </g>

  <!-- Curved 45-degree fitting body. -->
  <path d="M 300,356.50 L 300,280 L 354.09,225.91"
        fill="none" stroke="black" stroke-width="194.74" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 300,356.50 L 300,280 L 354.09,225.91"
        fill="none" stroke="url(#hatch)" stroke-width="190.74" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Continuous fitting bore D. -->
  <path d="M 300,356.50 L 300,280 L 354.09,225.91"
        fill="none" stroke="black" stroke-width="161.50" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 300,356.50 L 300,280 L 354.09,225.91"
        fill="none" stroke="white" stroke-width="157.50" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Socket cavities B. -->
  <path d="M 207.83,356.50 L 392.18,356.50 L 392.18,404.50 L 207.83,404.50 Z"
        fill="white" stroke="black" stroke-width="1.5"/>
  <g transform="translate(354.09 225.91) rotate(-45)">
    <path d="M 0,-92.18 L 48,-92.18 L 48,92.18 L 0,92.18 Z"
          fill="white" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- Internal stops: B reduces symmetrically to D at each socket bottom. -->
  <line x1="207.83" y1="356.50" x2="221.25" y2="356.50" stroke="black" stroke-width="1.75"/>
  <line x1="378.75" y1="356.50" x2="392.18" y2="356.50" stroke="black" stroke-width="1.75"/>
  <g transform="translate(354.09 225.91) rotate(-45)">
    <line x1="0" y1="-92.18" x2="0" y2="-78.75" stroke="black" stroke-width="1.75"/>
    <line x1="0" y1="78.75" x2="0" y2="92.18" stroke="black" stroke-width="1.75"/>
  </g>

  <!-- Centerlines. -->
  <path d="M 300,420 L 300,280 L 404,176"
        fill="none" stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- A and J along the diagonal socket axis. -->
  <g transform="translate(354.09 225.91) rotate(-45)" fill="none" stroke="black">
    <line x1="-76.5" y1="-142" x2="0" y2="-142" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="0" y1="-142" x2="48" y2="-142" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="-76.5" y1="-95.37" x2="-76.5" y2="-149" stroke-width="0.75"/>
    <line x1="0" y1="-112.97" x2="0" y2="-149" stroke-width="0.75"/>
    <line x1="48" y1="-112.97" x2="48" y2="-149" stroke-width="0.75"/>
  </g>
  <text x="191" y="145" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">A</text>
  <text x="260" y="82" font-size="15" font-style="italic" font-weight="bold">J</text>

  <!-- B, D, and C perpendicular to the diagonal socket axis. -->
  <g transform="translate(354.09 225.91) rotate(-45)" fill="none" stroke="black">
    <line x1="165" y1="-92.18" x2="165" y2="92.18" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="65" y1="-78.75" x2="65" y2="78.75" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="165" y1="92.18" x2="165" y2="112.97" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>

    <line x1="48" y1="-92.18" x2="173" y2="-92.18" stroke-width="0.75"/>
    <line x1="48" y1="92.18" x2="173" y2="92.18" stroke-width="0.75"/>
    <line x1="0" y1="-78.75" x2="73" y2="-78.75" stroke-width="0.75"/>
    <line x1="0" y1="78.75" x2="73" y2="78.75" stroke-width="0.75"/>
    <line x1="48" y1="112.97" x2="173" y2="112.97" stroke-width="0.75"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold" fill="black">
    <text x="496" y="101">B</text>
    <text x="408" y="170">D</text>
    <text x="547" y="148">C</text>
  </g>

  <!-- Minimum body wall G, moved outside for a future numeric value. -->
  <g fill="none" stroke="black">
    <line x1="145" y1="313" x2="196" y2="313" stroke-width="0.75"/>
    <line x1="196" y1="313" x2="211" y2="303" stroke-width="1"
          marker-end="url(#arrowEnd)"/>
  </g>
  <text x="152" y="318" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">G</text>

  <g font-size="11" fill="#555">
    <text x="20" y="464">Symmetric sectioned view based on supplied figure. ASME B16.11-2021, Table 6.1-1, NPS 2, Class 3000.</text>
    <text x="20" y="481">A=25.5 min; B=61.2–61.7; C=6.93 prom./6.04 min; D=51.7–53.3; G=5.54 min; J=16 min. Dimensions in mm.</text>
  </g>
</svg>
