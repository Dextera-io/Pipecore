<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" font-family="Arial, sans-serif">
  <title>2 inch threaded hex head bushing</title>
  <desc>NPS 2 threaded hex head bushing based on ASME B16.11-2021 Table 6.1-6. Top and sectioned views at 3 px/mm. Minimum male thread length A 22 mm, minimum hex head height G 9 mm, and nominal width across flats F 63.5 mm. Reduced female opening is representative because its nominal size was not specified.</desc>

  <rect width="780" height="590" fill="white"/>
  <defs>
    <pattern id="hatchHexBushing" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStartHexBushing" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndHexBushing" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Hex Head Bushing — ASME B16.11</text>

  <!-- Top view: F=63.5 mm across flats. -->
  <path d="M280,145 L335,49.75 L445,49.75 L500,145 L445,240.25 L335,240.25 Z"
        fill="white" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
  <circle cx="390" cy="145" r="50" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="390" cy="145" r="59" fill="none" stroke="#555" stroke-width="1"
          stroke-dasharray="12,5"/>
  <line x1="260" y1="145" x2="520" y2="145"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  <line x1="390" y1="33" x2="390" y2="257"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- F across flats: vertical dimension on left side of top view. -->
  <g fill="none" stroke="black">
    <line x1="335" y1="49.75" x2="211" y2="49.75" stroke-width="0.75"/>
    <line x1="335" y1="240.25" x2="211" y2="240.25" stroke-width="0.75"/>
    <line x1="218" y1="49.75" x2="218" y2="240.25" stroke-width="1"
          marker-start="url(#arrowStartHexBushing)" marker-end="url(#arrowEndHexBushing)"/>
  </g>
  <text x="204" y="149" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">F</text>

  <!-- Sectioned hex head, G=9 mm. Width matches top view point-to-point extent. -->
  <path d="M280,292 Q280,286 287,286 L493,286 Q500,286 500,292 L500,313 L280,313 Z"
        fill="url(#hatchHexBushing)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- External male threaded body, A=22 mm. Taper: wide at top, narrow at bottom. -->
  <path d="M299,313 L481,313 L477,379 L303,379 Z"
        fill="url(#hatchHexBushing)" stroke="black" stroke-width="1.75"/>
  <path d="M299,313 L293,316 L299,319 L293,322 L300,325 L294,328 L300,331
           L294,334 L300,337 L294,340 L301,343 L295,346 L301,349 L295,352
           L302,355 L296,358 L302,361 L296,364 L302,367 L296,370 L303,373 L303,379"
        fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M481,313 L487,316 L481,319 L487,322 L480,325 L486,328 L480,331
           L486,334 L480,337 L486,340 L479,343 L485,346 L479,349 L485,352
           L478,355 L484,358 L478,361 L484,364 L478,367 L484,370 L477,373 L477,379"
        fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Reduced female threaded passage. -->
  <path d="M340,285 L440,285 L432,380 L348,380 Z" fill="white"/>
  <g fill="none" stroke="black" stroke-width="1.05">
    <line x1="341" y1="291" x2="439" y2="291"/>
    <line x1="342" y1="297" x2="438" y2="297"/>
    <line x1="342" y1="303" x2="438" y2="303"/>
    <line x1="343" y1="309" x2="437" y2="309"/>
    <line x1="343" y1="315" x2="437" y2="315"/>
    <line x1="344" y1="321" x2="436" y2="321"/>
    <line x1="344" y1="327" x2="436" y2="327"/>
    <line x1="345" y1="333" x2="435" y2="333"/>
    <line x1="345" y1="339" x2="435" y2="339"/>
    <line x1="346" y1="345" x2="434" y2="345"/>
    <line x1="346" y1="351" x2="434" y2="351"/>
    <line x1="347" y1="357" x2="433" y2="357"/>
    <line x1="347" y1="363" x2="433" y2="363"/>
    <line x1="348" y1="369" x2="432" y2="369"/>
    <line x1="348" y1="375" x2="432" y2="375"/>
  </g>
  <path d="M340,285 L346,289 L341,293 L347,297 L342,301 L348,305 L343,309
           L349,313 L344,317 L350,321 L345,325 L351,329 L346,333 L352,337
           L347,341 L353,345 L348,349 L354,353 L349,357 L355,361 L350,365
           L356,369 L348,373 L348,379"
        fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M440,285 L434,289 L439,293 L433,297 L438,301 L432,305 L437,309
           L431,313 L436,317 L430,321 L435,325 L429,329 L434,333 L428,337
           L433,341 L427,345 L432,349 L426,353 L431,357 L425,361 L430,365
           L424,369 L432,373 L432,379"
        fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="299" y1="379" x2="348" y2="379" stroke="black" stroke-width="1.75"/>
  <line x1="432" y1="379" x2="481" y2="379" stroke="black" stroke-width="1.75"/>

  <line x1="390" y1="266" x2="390" y2="406"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- G and A. -->
  <g fill="none" stroke="black">
    <line x1="280" y1="286" x2="204" y2="286" stroke-width="0.75"/>
    <line x1="280" y1="313" x2="204" y2="313" stroke-width="0.75"/>
    <line x1="211" y1="286" x2="211" y2="313" stroke-width="1"
          marker-start="url(#arrowStartHexBushing)" marker-end="url(#arrowEndHexBushing)"/>

    <line x1="280" y1="379" x2="204" y2="379" stroke-width="0.75"/>
    <line x1="211" y1="313" x2="211" y2="379" stroke-width="1"
          marker-start="url(#arrowStartHexBushing)" marker-end="url(#arrowEndHexBushing)"/>
  </g>
  <text x="197" y="304" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">G</text>
  <text x="197" y="351" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">A</text>

  <g font-size="11" fill="#555">
    <text x="20" y="552">Top and sectioned views. ASME B16.11-2021, Table 6.1-6, NPS 2. Geometric scale: 3 px/mm.</text>
    <text x="20" y="570">A=22 min; G=9 min; F=63.5 nominal across flats. Thread per ASME B1.20.1. Representative reduced inner diameter.</text>
  </g>
</svg>
