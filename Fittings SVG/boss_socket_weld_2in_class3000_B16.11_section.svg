<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 socket-welding boss, sectioned view</title>
  <desc>NPS 2 Class 3000 socket-welding boss based on ASME B16.11-2021 Table 6.1-2. Uniform scale 3 px/mm. Outside diameter 79.4 mm, B 61.2 to 61.7 mm, D 51.7 to 53.3 mm, C 6.93 mm average and 6.04 mm minimum, J 16 mm minimum, and F 41 mm minimum.</desc>

  <rect width="760" height="500" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="23" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Socket Weld Boss — ASME B16.11</text>

  <!-- J + F body with small upper chamfers and 45-degree lower bevels. -->
  <path d="M 265.90,150
           L 494.10,150
           L 499.10,155
           L 499.10,291
           L 469.10,321
           L 290.90,321
           L 260.90,291
           L 260.90,155
           Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>

  <!-- Socket B, fitting bore D, and full socket-bottom edge. -->
  <path d="M 287.83,150
           L 472.18,150
           L 472.18,198
           L 458.75,198
           L 458.75,317
           L 461.75,321
           L 298.25,321
           L 301.25,317
           L 301.25,198
           L 287.83,198
           Z"
        fill="white" stroke="black" stroke-width="1.75"/>
  <line x1="287.83" y1="198" x2="472.18" y2="198"
        stroke="black" stroke-width="1.75"/>

  <line x1="380" y1="125" x2="380" y2="346"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Top B, D, and C dimensions. -->
  <g fill="none" stroke="black">
    <line x1="287.83" y1="150" x2="287.83" y2="52" stroke-width="0.75"/>
    <line x1="472.18" y1="150" x2="472.18" y2="52" stroke-width="0.75"/>
    <line x1="301.25" y1="198" x2="301.25" y2="85" stroke-width="0.75"/>
    <line x1="458.75" y1="198" x2="458.75" y2="85" stroke-width="0.75"/>
    <line x1="499.10" y1="155" x2="499.10" y2="52" stroke-width="0.75"/>
    <line x1="287.83" y1="59" x2="472.18" y2="59" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="301.25" y1="92" x2="458.75" y2="92" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="472.18" y1="59" x2="499.10" y2="59" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="380" y="53" text-anchor="middle">B</text>
    <text x="380" y="86" text-anchor="middle">D</text>
    <text x="505" y="53" text-anchor="start">C</text>
  </g>

  <!-- J and F outside. -->
  <g fill="none" stroke="black">
    <line x1="499.10" y1="150" x2="566" y2="150" stroke-width="0.75"/>
    <line x1="499.10" y1="198" x2="566" y2="198" stroke-width="0.75"/>
    <line x1="469.10" y1="321" x2="566" y2="321" stroke-width="0.75"/>
    <line x1="561" y1="150" x2="561" y2="198" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="561" y1="198" x2="561" y2="321" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="575" y="179">J</text>
    <text x="575" y="265">F</text>
  </g>

  <!-- 45-degree lower bevel callout. -->
  <path d="M 230,285 L 276,312" fill="none" stroke="black" stroke-width="1"
        marker-end="url(#arrowEnd)"/>
  <text x="178" y="278" font-size="13" font-weight="bold">45° bevel</text>

  <g font-size="11" fill="#555">
    <text x="20" y="464">Sectioned view. ASME B16.11-2021, Table 6.1-2, NPS 2, Class 3000. Geometric scale: 3 px/mm.</text>
    <text x="20" y="481">OD=79.4; B=61.2–61.7; C=6.93 prom./6.04 min; D=51.7–53.3; J=16 min; F=41 min (+2). Dimensions in mm.</text>
  </g>
</svg>
