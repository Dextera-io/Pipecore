<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="Arial, sans-serif">
  <title>2 inch threaded square head plug</title>
  <desc>NPS 2 threaded square head plug based on ASME B16.11-2021 Table 6.1-6. Uniform scale 3 px/mm. Minimum thread length A 22 mm, minimum square head height B 18 mm, and minimum width across flats C 33.27 mm.</desc>

  <rect width="780" height="500" fill="white"/>
  <defs>
    <marker id="arrowStartSquarePlug" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndSquarePlug" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <g id="maleThreadSquarePlug">
      <path d="M-91,0 L91,0 L87,66 L-87,66 Z" fill="white" stroke="black" stroke-width="1.75"/>
      <g fill="none" stroke="black" stroke-width="1.15">
        <line x1="-91" y1="5" x2="91" y2="5"/>
        <line x1="-90.5" y1="11" x2="90.5" y2="11"/>
        <line x1="-90" y1="17" x2="90" y2="17"/>
        <line x1="-89.5" y1="23" x2="89.5" y2="23"/>
        <line x1="-89" y1="29" x2="89" y2="29"/>
        <line x1="-88.5" y1="35" x2="88.5" y2="35"/>
        <line x1="-88" y1="41" x2="88" y2="41"/>
        <line x1="-88" y1="47" x2="88" y2="47"/>
        <line x1="-87.5" y1="53" x2="87.5" y2="53"/>
        <line x1="-87.5" y1="59" x2="87.5" y2="59"/>
      </g>
      <path d="M-91,0 L-97,3 L-90.5,6 L-96.5,9 L-90,12 L-96,15 L-89.5,18
               L-95.5,21 L-89,24 L-95,27 L-88.5,30 L-95,33 L-88.5,36 L-94.5,39
               L-88,42 L-94,45 L-87.5,48 L-93.5,51 L-87.5,54 L-93,57
               L-87,60 L-87,66"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M91,0 L97,3 L90.5,6 L96.5,9 L90,12 L96,15 L89.5,18
               L95.5,21 L89,24 L95,27 L88.5,30 L95,33 L88.5,36 L94.5,39
               L88,42 L94,45 L87.5,48 L93.5,51 L87.5,54 L93,57
               L87,60 L87,66"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Square Head Plug — ASME B16.11</text>

  <!-- Square head: C=33.27 mm and B=18 mm. -->
  <path d="M346,176 Q340,176 340,182 L340,230 L440,230 L440,182 Q440,176 434,176 Z"
        fill="white" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- External male thread: A=22 mm. -->
  <use href="#maleThreadSquarePlug" transform="translate(390 230)"/>

  <line x1="390" y1="146" x2="390" y2="326"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- C across square head. -->
  <g fill="none" stroke="black">
    <line x1="340" y1="176" x2="340" y2="91" stroke-width="0.75"/>
    <line x1="440" y1="176" x2="440" y2="91" stroke-width="0.75"/>
    <line x1="340" y1="98" x2="440" y2="98" stroke-width="1"
          marker-start="url(#arrowStartSquarePlug)" marker-end="url(#arrowEndSquarePlug)"/>
  </g>
  <text x="390" y="91" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">C</text>

  <!-- B and A at left. -->
  <g fill="none" stroke="black">
    <line x1="340" y1="176" x2="218" y2="176" stroke-width="0.75"/>
    <line x1="340" y1="230" x2="218" y2="230" stroke-width="0.75"/>
    <line x1="225" y1="176" x2="225" y2="230" stroke-width="1"
          marker-start="url(#arrowStartSquarePlug)" marker-end="url(#arrowEndSquarePlug)"/>

    <line x1="299" y1="230" x2="218" y2="230" stroke-width="0.75"/>
    <line x1="299" y1="296" x2="218" y2="296" stroke-width="0.75"/>
    <line x1="225" y1="230" x2="225" y2="296" stroke-width="1"
          marker-start="url(#arrowStartSquarePlug)" marker-end="url(#arrowEndSquarePlug)"/>
  </g>
  <text x="211" y="207" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">B</text>
  <text x="211" y="268" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">A</text>

  <g font-size="11" fill="#555">
    <text x="20" y="462">Exterior view. ASME B16.11-2021, Table 6.1-6, NPS 2. Geometric scale: 3 px/mm.</text>
    <text x="20" y="480">A=22 min; B=18 min; C=33.27 min across flats. Male thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
