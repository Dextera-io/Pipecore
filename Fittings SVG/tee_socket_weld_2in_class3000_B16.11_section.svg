<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 socket-welding tee, sectioned view</title>
  <desc>Symmetrical NPS 2 Class 3000 socket-welding tee based on ASME B16.11-2021 Table 6.1-1. Uniform scale 3 px/mm. A 38 mm minimum, B 61.2 to 61.7 mm, C 6.93 mm average and 6.04 mm minimum, D 51.7 to 53.3 mm, G 5.54 mm minimum, and J 16 mm minimum.</desc>

  <rect width="760" height="530" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="23" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Socket Weld Tee — ASME B16.11</text>

  <!-- Three identical socket bodies. Scale: 3 px/mm. -->
  <path d="M 267.04,168 L 492.97,168 L 492.97,216 L 267.04,216 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>
  <path d="M 218,217.04 L 266,217.04 L 266,442.97 L 218,442.97 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>
  <path d="M 494,217.04 L 542,217.04 L 542,442.97 L 494,442.97 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>

  <!--
    Robust tee body. G is a tabulated minimum, so the displayed body is
    intentionally thicker while B, C, D, J, and A remain at the common scale.
  -->
  <path d="M 266,330 L 494,330 M 380,216 L 380,330"
        fill="none" stroke="black" stroke-width="229.93" stroke-linecap="butt"/>
  <path d="M 266,330 L 494,330 M 380,216 L 380,330"
        fill="none" stroke="url(#hatch)" stroke-width="225.93" stroke-linecap="butt"/>

  <!-- Continuous tee bore D with rounded branch corners. -->
  <path d="M 301.25,216
           L 458.75,216
           L 458.75,239.25
           Q 458.75,251.25 470.75,251.25
           L 494,251.25
           L 494,408.75
           L 266,408.75
           L 266,251.25
           L 289.25,251.25
           Q 301.25,251.25 301.25,239.25
           Z"
        fill="white" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Socket cavities B. -->
  <path d="M 287.83,168 L 472.18,168 L 472.18,216 L 287.83,216 Z"
        fill="white" stroke="black" stroke-width="1.5"/>
  <path d="M 218,237.83 L 266,237.83 L 266,422.18 L 218,422.18 Z"
        fill="white" stroke="black" stroke-width="1.5"/>
  <path d="M 494,237.83 L 542,237.83 L 542,422.18 L 494,422.18 Z"
        fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Remove construction seams between contiguous socket and body material. -->
  <g stroke="url(#hatch)" stroke-width="4">
    <line x1="267.04" y1="216" x2="287.83" y2="216"/>
    <line x1="472.18" y1="216" x2="492.97" y2="216"/>
    <line x1="266" y1="217.04" x2="266" y2="237.83"/>
    <line x1="266" y1="422.18" x2="266" y2="442.97"/>
    <line x1="494" y1="217.04" x2="494" y2="237.83"/>
    <line x1="494" y1="422.18" x2="494" y2="442.97"/>
  </g>

  <!-- Three symmetrical socket stops, B to D. -->
  <g stroke="black" stroke-width="1.75">
    <line x1="287.83" y1="216" x2="301.25" y2="216"/>
    <line x1="458.75" y1="216" x2="472.18" y2="216"/>
    <line x1="266" y1="237.83" x2="266" y2="251.25"/>
    <line x1="266" y1="408.75" x2="266" y2="422.18"/>
    <line x1="494" y1="237.83" x2="494" y2="251.25"/>
    <line x1="494" y1="408.75" x2="494" y2="422.18"/>
  </g>

  <!-- Centerlines. -->
  <path d="M 380,150 L 380,330 M 200,330 L 560,330"
        fill="none" stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Top B, C, and D dimensions. -->
  <g fill="none" stroke="black">
    <line x1="267.04" y1="168" x2="267.04" y2="75" stroke-width="0.75"/>
    <line x1="287.83" y1="168" x2="287.83" y2="75" stroke-width="0.75"/>
    <line x1="472.18" y1="168" x2="472.18" y2="75" stroke-width="0.75"/>
    <line x1="301.25" y1="216" x2="301.25" y2="106" stroke-width="0.75"/>
    <line x1="458.75" y1="216" x2="458.75" y2="106" stroke-width="0.75"/>

    <line x1="267.04" y1="82" x2="287.83" y2="82" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="287.83" y1="82" x2="472.18" y2="82" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="301.25" y1="113" x2="458.75" y2="113" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="263" y="76" text-anchor="end">C</text>
    <text x="380" y="76" text-anchor="middle">B</text>
    <text x="380" y="107" text-anchor="middle">D</text>
  </g>

  <!-- J and A at the left. -->
  <g fill="none" stroke="black">
    <line x1="267.04" y1="168" x2="105" y2="168" stroke-width="0.75"/>
    <line x1="266" y1="216" x2="105" y2="216" stroke-width="0.75"/>
    <line x1="266" y1="330" x2="105" y2="330" stroke-width="0.75"/>
    <line x1="110" y1="168" x2="110" y2="216" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="110" y1="216" x2="110" y2="330" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="118" y="197" text-anchor="start">J</text>
    <text x="118" y="280" text-anchor="start">A</text>
  </g>

  <!-- G kept outside the fitting for a future numeric value. -->
  <g fill="none" stroke="black">
    <line x1="380" y1="458" x2="380" y2="420" stroke-width="1"
          marker-end="url(#arrowEnd)"/>
  </g>
  <text x="380" y="476" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">G</text>

  <g font-size="11" fill="#555">
    <text x="20" y="494">Symmetric sectioned view. ASME B16.11-2021, Table 6.1-1, NPS 2, Class 3000. Geometric scale: 3 px/mm.</text>
    <text x="20" y="511">A=38 min (±2); B=61.2–61.7; C=6.93 avg./6.04 min; D=51.7–53.3; G=5.54 min; J=16 min. Dimensions in mm.</text>
  </g>
</svg>
