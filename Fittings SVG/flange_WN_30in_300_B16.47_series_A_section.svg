<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
<rect x="0" y="0" width="760" height="353" fill="white"/>

<metadata>
  ASME B16.47 Series A, NPS 30, Class 300.
  Source dimensions in millimetres: O=1092, R=857, tf=90.7, Y=208, X=827, A=762.
  Drawing scale: 0.4771062271 px/mm; displayed outside diameter: 521 px.
  Raised-face height: 1.5 mm. Radius r1 intentionally not dimensioned.
</metadata>

<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/>
  </pattern>
  <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M9,0 L9,6 L0,3 z" fill="black"/>
  </marker>
  <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L0,6 L9,3 z" fill="black"/>
  </marker>
</defs>

<text x="355.35" y="24" text-anchor="middle" font-size="18" font-weight="bold">30&quot; Class 300 ASME B16.47 Series A Flange &#8212; Sectioned View</text>

<!-- Sectioned flange: raised face down -->
<path d="M 528.06,139.28
         L 537.13,139.28
         L 537.13,151.00
         C 537.13,169.00 544.00,189.00 552.63,195.25
         L 615.85,195.25
         L 615.85,238.52
         L 559.79,238.52
         L 559.79,239.24
         L 528.06,239.24
         Z"
      fill="url(#hatch)" stroke="black" stroke-width="1.5"/>
<path d="M 182.64,139.28
         L 173.57,139.28
         L 173.57,151.00
         C 173.57,169.00 166.70,189.00 158.07,195.25
         L 94.85,195.25
         L 94.85,238.52
         L 150.91,238.52
         L 150.91,239.24
         L 182.64,239.24
         Z"
      fill="url(#hatch)" stroke="black" stroke-width="1.5"/>

<!-- Bolt holes on the 997 mm bolt circle -->
<rect x="106.14" y="195.25" width="22.72" height="43.27" fill="white" stroke="black" stroke-width="1.5"/>
<rect x="581.84" y="195.25" width="22.72" height="43.27" fill="white" stroke="black" stroke-width="1.5"/>

<!-- Visible bore edges and centerline -->
<line x1="182.64" y1="139.28" x2="528.06" y2="139.28" stroke="black" stroke-width="1.75"/>
<line x1="182.64" y1="239.24" x2="528.06" y2="239.24" stroke="black" stroke-width="1.75"/>
<line x1="355.35" y1="42" x2="355.35" y2="315" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

<!-- X: hub diameter at base -->
<line x1="158.07" y1="195.25" x2="158.07" y2="60" stroke="black" stroke-width="0.75"/>
<line x1="552.63" y1="195.25" x2="552.63" y2="60" stroke="black" stroke-width="0.75"/>
<line x1="158.07" y1="60" x2="552.63" y2="60" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
<text x="355.35" y="55" text-anchor="middle" font-size="15" font-weight="bold">X</text>

<!-- A: diameter at welding end -->
<line x1="173.57" y1="139.28" x2="173.57" y2="88" stroke="black" stroke-width="0.75"/>
<line x1="537.13" y1="139.28" x2="537.13" y2="88" stroke="black" stroke-width="0.75"/>
<line x1="173.57" y1="88" x2="537.13" y2="88" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
<text x="355.35" y="83" text-anchor="middle" font-size="15" font-weight="bold">A</text>

<!-- R: raised-face diameter -->
<line x1="150.91" y1="239.24" x2="150.91" y2="270" stroke="black" stroke-width="0.75"/>
<line x1="559.79" y1="239.24" x2="559.79" y2="270" stroke="black" stroke-width="0.75"/>
<line x1="150.91" y1="270" x2="559.79" y2="270" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
<text x="355.35" y="265" text-anchor="middle" font-size="15" font-weight="bold">R</text>

<!-- O: outside diameter -->
<line x1="94.85" y1="238.52" x2="94.85" y2="298" stroke="black" stroke-width="0.75"/>
<line x1="615.85" y1="238.52" x2="615.85" y2="298" stroke="black" stroke-width="0.75"/>
<line x1="94.85" y1="298" x2="615.85" y2="298" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
<text x="355.35" y="293" text-anchor="middle" font-size="15" font-weight="bold">O</text>

<!-- tf: flange thickness, excluding raised face -->
<line x1="615.85" y1="195.25" x2="638" y2="195.25" stroke="black" stroke-width="0.75"/>
<line x1="615.85" y1="238.52" x2="638" y2="238.52" stroke="black" stroke-width="0.75"/>
