<text x="650" y="221.9" text-anchor="start" font-size="15" font-weight="bold">tf</text>

<!-- Y: overall through-hub length to the same lower datum as tf -->
<line x1="537.13" y1="139.28" x2="683" y2="139.28" stroke="black" stroke-width="0.75"/>
<line x1="615.85" y1="238.52" x2="683" y2="238.52" stroke="black" stroke-width="0.75"/>
<line x1="683" y1="139.28" x2="683" y2="238.52" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
<text x="695" y="193.9" text-anchor="start" font-size="15" font-weight="bold">Y</text>
</svg>
