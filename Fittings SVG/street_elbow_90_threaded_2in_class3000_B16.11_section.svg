<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 threaded street elbow, sectioned view</title>
  <desc>Proportional sectioned view based on ASME B16.11-2021 Table 6.1-4. NPS 2 Class 3000 dimensions in millimeters: A 64 minimum, J 84 minimum, H 84 minimum, G1 7.14 minimum, G2 7.64 minimum, B 19 minimum, L2 19.2 nominal, and L 22 nominal. Drawing scale: 3 SVG units per millimeter.</desc>

  <rect width="820" height="620" fill="white"/>

  <defs>
    <pattern id="hatchStreet" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStartStreet" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndStreet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>

    <!-- Internal tapered female thread: L2 = 19.2 mm = 57.6 SVG units. -->
    <g id="femaleThreadStreet">
      <path d="M-90.5,0 L90.5,0 L84,57.6 L-84,57.6 Z" fill="white"/>
      <path d="M-90.5,0 L-90,4 L-84,8 L-89,12 L-83,16 L-88,20 L-82,24
               L-87,28 L-81,32 L-86,36 L-80,40 L-85,44 L-79,48 L-84,52 L-84,57.6"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M90.5,0 L90,4 L84,8 L89,12 L83,16 L88,20 L82,24
               L87,28 L81,32 L86,36 L80,40 L85,44 L79,48 L84,52 L84,57.6"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="-90.5" y1="0" x2="90.5" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="-84" y1="57.6" x2="-69" y2="57.6" stroke="black" stroke-width="1.5"/>
      <line x1="69" y1="57.6" x2="84" y2="57.6" stroke="black" stroke-width="1.5"/>
    </g>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Street Elbow — ASME B16.11</text>

  <!-- Elbow body. Centerline intersection is (340,340); dimensional scale is 3 px/mm. -->
  <path d="M340,218 L340,340 L526,340"
        fill="none" stroke="black" stroke-width="210" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M340,218 L340,340 L526,340"
        fill="none" stroke="url(#hatchStreet)" stroke-width="206" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Female band: H = 84 mm = 252 SVG units. -->
  <path d="M214,148 L466,148 L466,206
           C466,218 456,228 445,228 L235,228
           C224,228 214,218 214,206 Z"
        fill="url(#hatchStreet)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Continuous internal flow passage. -->
  <path d="M340,206 L340,340 L526,340"
        fill="none" stroke="black" stroke-width="142" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M340,206 L340,340 L526,340"
        fill="none" stroke="white" stroke-width="138" stroke-linecap="butt" stroke-linejoin="round"/>
  <use href="#femaleThreadStreet" transform="translate(340 148)"/>

  <!-- Upper branch: remove the original rounded shoulder, continue the section hatch,
       and use a straight vertical drop followed by a horizontal wall. -->
  <path d="M442,232 L526,232 L526,245 L442,245 Z" fill="white"/>
  <rect x="440" y="203" width="26" height="42" fill="url(#hatchStreet)"/>
  <!-- Remove the residual horizontal seam from the former rounded band. -->
  <rect x="410" y="225" width="33" height="6" fill="url(#hatchStreet)"/>
  <line x1="410" y1="206" x2="410" y2="271" stroke="black" stroke-width="1.75"/>
  <path d="M340,445 L526,435 L526,448 L340,448 Z" fill="white"/>
  <path d="M466,203 L466,245 L526,245" fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="miter"/>
  <line x1="340" y1="445" x2="526" y2="435" stroke="black" stroke-width="1.75"/>

  <!-- Male threaded end: L = 22 mm = 66 SVG units.
       The upper crest line remains horizontal; only the thread roots reduce its local wall. -->
  <path d="M526,245 L592,245 L610,261 L610,271 L526,271 Z" fill="url(#hatchStreet)"/>
  <path d="M526,409 L610,409 L610,419 L592,430 L526,435 Z" fill="url(#hatchStreet)"/>
  <rect x="526" y="271" width="84" height="138" fill="white"/>

  <!-- Upper external thread, tapered toward the male end. -->
  <path d="M526,245
           L530,250 L534,245 L538,250 L542,245 L546,250 L550,245 L554,250
           L558,245 L562,250 L566,245 L570,250 L574,245 L578,250 L582,245 L586,250 L592,245"
        fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lower external thread, mirrored about the horizontal centerline. -->
  <path d="M526,435
           L530,429.7 L534,434.4 L538,429.1 L542,433.8 L546,428.5 L550,433.2 L554,427.9
           L558,432.6 L562,427.3 L566,432.0 L570,426.7 L574,431.4 L578,426.1 L582,430.8 L586,425.5 L592,430"
        fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Smooth red-reference contour: end chamfers, opening faces, and bore. -->
  <g fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="round">
    <path d="M592,245 L610,261 L610,271"/>
    <path d="M610,409 L610,419 L592,430"/>
    <line x1="526" y1="271" x2="610" y2="271"/>
    <line x1="526" y1="409" x2="610" y2="409"/>
  </g>

  <!-- Centerlines. -->
  <path d="M340,126 L340,340 L616,340" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- H: outside diameter of female band. -->
  <g fill="none" stroke="black">
    <line x1="214" y1="148" x2="214" y2="72" stroke-width="0.75"/>
    <line x1="466" y1="148" x2="466" y2="72" stroke-width="0.75"/>
    <line x1="214" y1="80" x2="466" y2="80" stroke-width="1" marker-start="url(#arrowStartStreet)" marker-end="url(#arrowEndStreet)"/>
  </g>
  <text x="340" y="73" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">H</text>

  <!-- A: center to female end, 64 mm = 192 SVG units. -->
  <g fill="none" stroke="black">
    <line x1="466" y1="148" x2="704" y2="148" stroke-width="0.75"/>
    <line x1="592" y1="340" x2="704" y2="340" stroke-width="0.75"/>
    <line x1="694" y1="148" x2="694" y2="340" stroke-width="1" marker-start="url(#arrowStartStreet)" marker-end="url(#arrowEndStreet)"/>
  </g>
  <text x="684" y="250" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">A</text>

  <!-- J: center to male end, 84 mm = 252 SVG units. -->
  <g fill="none" stroke="black">
    <line x1="340" y1="340" x2="340" y2="535" stroke-width="0.75"/>
    <line x1="592" y1="430.5" x2="592" y2="535" stroke-width="0.75"/>
    <line x1="340" y1="526" x2="592" y2="526" stroke-width="1" marker-start="url(#arrowStartStreet)" marker-end="url(#arrowEndStreet)"/>
  </g>
  <text x="466" y="519" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">J</text>

  <!-- L2 at the female end. -->
  <g fill="none" stroke="black">
    <line x1="214" y1="148" x2="92" y2="148" stroke-width="0.75"/>
    <line x1="256" y1="205.6" x2="92" y2="205.6" stroke-width="0.75"/>
    <line x1="100" y1="148" x2="100" y2="205.6" stroke-width="1" marker-start="url(#arrowStartStreet)" marker-end="url(#arrowEndStreet)"/>
  </g>
  <text x="110" y="181" font-size="15" font-style="italic" font-weight="bold">L₂</text>

  <!-- L at the male threaded end. -->
  <g fill="none" stroke="black">
    <line x1="526" y1="249.5" x2="526" y2="215" stroke-width="0.75"/>
    <line x1="610" y1="261" x2="610" y2="215" stroke-width="0.75"/>
    <line x1="526" y1="222" x2="610" y2="222" stroke-width="1" marker-start="url(#arrowStartStreet)" marker-end="url(#arrowEndStreet)"/>
  </g>
  <text x="568" y="215" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">L</text>

  <!-- Minimum walls G1 and G2. -->
  <line x1="156" y1="280" x2="238" y2="280" stroke="black" stroke-width="1" marker-end="url(#arrowEndStreet)"/>
  <line x1="318" y1="280" x2="271" y2="280" stroke="black" stroke-width="1" marker-end="url(#arrowEndStreet)"/>
  <text x="146" y="286" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">G₁</text>
  <line x1="526" y1="378" x2="526" y2="409" stroke="black" stroke-width="1" marker-end="url(#arrowEndStreet)"/>
  <line x1="526" y1="478" x2="526" y2="435" stroke="black" stroke-width="1" marker-end="url(#arrowEndStreet)"/>
  <text x="526" y="499" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">G₂</text>

  <g font-size="11" fill="#555">
    <text x="20" y="582">Schematic sectioned view. ASME B16.11-2021, Table 6.1-4, NPS 2, Class 3000. Scale: 3 SVG units/mm.</text>
    <text x="20" y="600">A=64 min; J=84 min; H=84 min; G₁=7.14 min; G₂=7.64 min; B=19 min; L₂=19.2 nominal; L=22 nominal. Dimensions in mm.</text>
  </g>
</svg>
