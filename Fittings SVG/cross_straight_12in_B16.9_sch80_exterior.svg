<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>12 inch ASME B16.9 Schedule 80 straight cross</title>
  <desc>Exterior view of a proportional NPS 12 straight cross based on ASME B16.9-2024 Table 6.1-7: outside diameter 323.8 mm, run center-to-end C=254 mm, and outlet center-to-end M=254 mm. All four ends use integrated Schedule 80 bevels. Thickness dimensions are omitted.</desc>

  <rect x="0" y="0" width="760" height="353" fill="white"/>

  <defs>
    <linearGradient id="runFill" gradientUnits="userSpaceOnUse" x1="0" y1="105.76" x2="0" y2="284.24">
      <stop offset="0" stop-color="#aebbc9"/>
      <stop offset="0.22" stop-color="#d9e1e9"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#d9e1e9"/>
      <stop offset="1" stop-color="#aebbc9"/>
    </linearGradient>
    <linearGradient id="branchFill" gradientUnits="userSpaceOnUse" x1="275.76" y1="0" x2="454.24" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.50" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M 225,114.52 L 236.41,105.76 L 255,105.76
               C 270,105.76 275.76,95 275.76,80
               L 275.76,66.41 L 284.52,55 L 445.48,55 L 454.24,66.41 L 454.24,80
               C 454.24,95 460,105.76 475,105.76
               L 493.59,105.76 L 505,114.52 L 505,275.48 L 493.59,284.24 L 475,284.24
               C 460,284.24 454.24,295 454.24,310
               L 454.24,323.59 L 445.48,335 L 284.52,335 L 275.76,323.59 L 275.76,310
               C 275.76,295 270,284.24 255,284.24
               L 236.41,284.24 L 225,275.48 Z"/>
    </clipPath>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="365" y="20" text-anchor="middle" font-size="17" font-weight="bold">12&quot; Straight Cross &#8212; ASME B16.9</text>

  <!-- One continuous contour with four integrated Schedule 80 bevels. -->
  <path d="M 225,114.52 L 236.41,105.76 L 255,105.76
           C 270,105.76 275.76,95 275.76,80
           L 275.76,66.41 L 284.52,55 L 445.48,55 L 454.24,66.41 L 454.24,80
           C 454.24,95 460,105.76 475,105.76
           L 493.59,105.76 L 505,114.52 L 505,275.48 L 493.59,284.24 L 475,284.24
           C 460,284.24 454.24,295 454.24,310
           L 454.24,323.59 L 445.48,335 L 284.52,335 L 275.76,323.59 L 275.76,310
           C 275.76,295 270,284.24 255,284.24
           L 236.41,284.24 L 225,275.48 Z"
        fill="url(#runFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Vertical cylindrical highlight at the intersection of both tubes. -->
  <g clip-path="url(#bodyClip)">
    <rect x="275.76" y="55" width="178.48" height="280" fill="url(#branchFill)"/>
  </g>
  <path d="M 225,114.52 L 236.41,105.76 L 255,105.76
           C 270,105.76 275.76,95 275.76,80
           L 275.76,66.41 L 284.52,55 L 445.48,55 L 454.24,66.41 L 454.24,80
           C 454.24,95 460,105.76 475,105.76
           L 493.59,105.76 L 505,114.52 L 505,275.48 L 493.59,284.24 L 475,284.24
           C 460,284.24 454.24,295 454.24,310
           L 454.24,323.59 L 445.48,335 L 284.52,335 L 275.76,323.59 L 275.76,310
           C 275.76,295 270,284.24 255,284.24
           L 236.41,284.24 L 225,275.48 Z"
        fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Run and branch centerlines. -->
  <line x1="190" y1="195" x2="540" y2="195" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  <line x1="365" y1="35" x2="365" y2="345" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- C: left and right run center-to-end dimensions. -->
  <line x1="225" y1="114.52" x2="225" y2="45" stroke="black" stroke-width="0.75"/>
  <line x1="365" y1="55" x2="365" y2="45" stroke="black" stroke-width="0.75"/>
  <line x1="505" y1="114.52" x2="505" y2="45" stroke="black" stroke-width="0.75"/>
  <line x1="225" y1="45" x2="365" y2="45" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <line x1="365" y1="45" x2="505" y2="45" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="295" y="40" text-anchor="middle" font-size="15" font-weight="bold">C</text>
  <text x="435" y="40" text-anchor="middle" font-size="15" font-weight="bold">C</text>

  <!-- M: upper and lower branch center-to-end dimensions. -->
  <line x1="445.48" y1="55" x2="555" y2="55" stroke="black" stroke-width="0.75"/>
  <line x1="505" y1="195" x2="555" y2="195" stroke="black" stroke-width="0.75"/>
  <line x1="445.48" y1="335" x2="555" y2="335" stroke="black" stroke-width="0.75"/>
  <line x1="550" y1="55" x2="550" y2="195" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <line x1="550" y1="195" x2="550" y2="335" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="562" y="130" text-anchor="start" font-size="15" font-weight="bold">M</text>
  <text x="562" y="270" text-anchor="start" font-size="15" font-weight="bold">M</text>
</svg>
