<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>12 inch Class 300 Lapped flange, sectioned view</title>
  <desc>Proportional section based on ASME B16.5-2025 Tables 10 and 11: O 521 mm, W 450.8 mm, bolt hole 31.75 mm, tf 50.8 mm, X 375 mm, Y 102 mm, lapped bore B1 328.2 mm, and corner radius r 13 mm.</desc>

  <rect x="0" y="0" width="760" height="353" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="355.35" y="24" text-anchor="middle" font-size="18" font-weight="bold">12" Class 300 Lapped Flange — Sectioned View</text>

  <!-- Sectioned body. Scale: 1 px = 1 mm. -->
  <path d="M 519.45,136.52
           L 536.57,136.52
           L 542.85,187.72
           L 615.85,187.72
           L 615.85,238.52
           L 532.45,238.52
           A 13,13 0 0 1 519.45,225.52
           L 519.45,136.52
           Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.5"/>
  <path d="M 191.25,136.52
           L 174.13,136.52
           L 167.85,187.72
           L 94.85,187.72
           L 94.85,238.52
           L 178.25,238.52
           A 13,13 0 0 0 191.25,225.52
           L 191.25,136.52
           Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.5"/>

  <!-- Two diametrically opposed bolt holes in the section plane. -->
  <rect x="114.10" y="187.72" width="31.75" height="50.80" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="564.85" y="187.72" width="31.75" height="50.80" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Center line and visible edges. -->
  <line x1="355.35" y1="42" x2="355.35" y2="315" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  <line x1="191.25" y1="136.52" x2="519.45" y2="136.52" stroke="black" stroke-width="1.75"/>
  <line x1="178.25" y1="238.52" x2="532.45" y2="238.52" stroke="black" stroke-width="1.5"/>

  <!-- O: flange outside diameter. -->
  <line x1="94.85" y1="238.52" x2="94.85" y2="306" stroke="black" stroke-width="0.75"/>
  <line x1="615.85" y1="238.52" x2="615.85" y2="306" stroke="black" stroke-width="0.75"/>
  <line x1="94.85" y1="298" x2="615.85" y2="298" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="355.35" y="293" text-anchor="middle" font-size="15" font-weight="bold">O</text>

  <!-- W: bolt circle diameter. -->
  <line x1="129.98" y1="238.52" x2="129.98" y2="278" stroke="black" stroke-width="0.75"/>
  <line x1="580.73" y1="238.52" x2="580.73" y2="278" stroke="black" stroke-width="0.75"/>
  <line x1="129.98" y1="270" x2="580.73" y2="270" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="355.35" y="265" text-anchor="middle" font-size="15" font-weight="bold">W</text>
  <line x1="129.98" y1="202.60" x2="129.98" y2="223.60" stroke="#c0392b" stroke-width="0.75"/>
  <line x1="580.73" y1="202.60" x2="580.73" y2="223.60" stroke="#c0392b" stroke-width="0.75"/>

  <!-- B1: lapped flange bore diameter. -->
  <line x1="191.25" y1="136.52" x2="191.25" y2="103" stroke="black" stroke-width="0.75"/>
  <line x1="519.45" y1="136.52" x2="519.45" y2="103" stroke="black" stroke-width="0.75"/>
  <line x1="191.25" y1="108" x2="519.45" y2="108" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="355.35" y="103" text-anchor="middle" font-size="15" font-weight="bold">B1</text>

  <!-- X: hub diameter at base. -->
  <line x1="167.85" y1="187.72" x2="167.85" y2="68" stroke="black" stroke-width="0.75"/>
  <line x1="542.85" y1="187.72" x2="542.85" y2="68" stroke="black" stroke-width="0.75"/>
  <line x1="167.85" y1="75" x2="542.85" y2="75" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="355.35" y="70" text-anchor="middle" font-size="15" font-weight="bold">X</text>

  <!-- tf: minimum flange thickness. -->
  <line x1="615.85" y1="238.52" x2="640" y2="238.52" stroke="black" stroke-width="0.75"/>
  <line x1="615.85" y1="187.72" x2="640" y2="187.72" stroke="black" stroke-width="0.75"/>
  <line x1="638" y1="238.52" x2="638" y2="187.72" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="647" y="218" text-anchor="start" font-size="15" font-weight="bold">tf</text>

  <!-- Y: length through hub; lower datum is the same lower plane used by tf. -->
  <line x1="536.57" y1="136.52" x2="687" y2="136.52" stroke="black" stroke-width="0.75"/>
  <line x1="615.85" y1="238.52" x2="687" y2="238.52" stroke="black" stroke-width="0.75"/>
  <line x1="680" y1="136.52" x2="680" y2="238.52" stroke="black" stroke-width="1" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="690" y="192" text-anchor="start" font-size="15" font-weight="bold">Y</text>

  <!-- r: inside corner radius for the lapped flange. -->
  <line x1="563" y1="218" x2="527.5" y2="231.5" stroke="black" stroke-width="1" marker-end="url(#arrowEnd)"/>
  <text x="571" y="216" text-anchor="start" font-size="15" font-weight="bold">r</text>

  <g font-size="11" fill="#555">
    <text x="20" y="329">Geometría proporcional basada en ASME B16.5-2025.</text>
    <text x="20" y="345">O=521; W=450.8; X=375; B1=328.2; tf=50.8; Y=102; r=13 mm; 16 agujeros Ø1-1/4".</text>
  </g>
</svg>
