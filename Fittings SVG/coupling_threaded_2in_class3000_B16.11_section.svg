<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="-80 0 860 560" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 threaded coupling, sectioned view</title>
  <desc>Sectioned NPS 2 Class 3000 threaded coupling based on ASME B16.11-2021 Tables 6.1-5 and 6.1-3. Dimensions: outside diameter D 76 mm, end-to-end W 86 mm, minimum perfect thread B 19 mm, and minimum effective thread L2 19.2 mm.</desc>

  <rect x="-80" width="860" height="560" fill="white"/>

  <defs>
    <pattern id="hatchCouplingT" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStartCouplingT" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndCouplingT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>

    <g id="femaleThreadCouplingT">
      <path d="M-90.5,0 L90.5,0 L84,58 L-84,58 Z" fill="white"/>
      <path d="M-90.5,0 L-90,4 L-84,8 L-89,12 L-83,16 L-88,20 L-82,24
               L-87,28 L-81,32 L-86,36 L-80,40 L-85,44 L-79,48 L-84,52 L-84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M90.5,0 L90,4 L84,8 L89,12 L83,16 L88,20 L82,24
               L87,28 L81,32 L86,36 L80,40 L85,44 L79,48 L84,52 L84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="-90.5" y1="0" x2="90.5" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="-84" y1="58" x2="-69" y2="58" stroke="black" stroke-width="1.5"/>
      <line x1="69" y1="58" x2="84" y2="58" stroke="black" stroke-width="1.5"/>
    </g>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Coupling — ASME B16.11</text>

  <!-- Coupling body: D=76 mm and W=86 mm at 3 px/mm, with small exterior bevels. -->
  <path d="M282,145 L498,145 L504,151 L504,397 L498,403
           L282,403 L276,397 L276,151 Z"
        fill="url(#hatchCouplingT)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Smooth through-bore between the two threaded ends. -->
  <rect x="321" y="202" width="138" height="144" fill="white"/>
  <line x1="321" y1="202" x2="321" y2="346" stroke="black" stroke-width="1.5"/>
  <line x1="459" y1="202" x2="459" y2="346" stroke="black" stroke-width="1.5"/>
  <line x1="321" y1="203" x2="459" y2="203" stroke="black" stroke-width="1.5"/>
  <line x1="321" y1="345" x2="459" y2="345" stroke="black" stroke-width="1.5"/>

  <!-- Female threads at both ends. -->
  <use href="#femaleThreadCouplingT" transform="translate(390 145)"/>
  <use href="#femaleThreadCouplingT" transform="translate(390 403) rotate(180)"/>

  <!-- Centerline. -->
  <line x1="390" y1="118" x2="390" y2="430"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Outside diameter D. -->
  <g fill="none" stroke="black">
    <line x1="276" y1="145" x2="276" y2="84" stroke-width="0.75"/>
    <line x1="504" y1="145" x2="504" y2="84" stroke-width="0.75"/>
    <line x1="276" y1="91" x2="504" y2="91" stroke-width="1"
          marker-start="url(#arrowStartCouplingT)" marker-end="url(#arrowEndCouplingT)"/>
  </g>
  <text x="390" y="84" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">D</text>

  <!-- Overall length W and thread lengths B / L2. -->
  <g fill="none" stroke="black">
    <line x1="276" y1="145" x2="53" y2="145" stroke-width="0.75"/>
    <line x1="276" y1="403" x2="53" y2="403" stroke-width="0.75"/>
    <line x1="60" y1="145" x2="60" y2="403" stroke-width="1"
          marker-start="url(#arrowStartCouplingT)" marker-end="url(#arrowEndCouplingT)"/>

    <line x1="300" y1="145" x2="102" y2="145" stroke-width="0.75"/>
    <line x1="306" y1="202.6" x2="102" y2="202.6" stroke-width="0.75"/>
    <line x1="109" y1="145" x2="109" y2="202.6" stroke-width="1"
          marker-start="url(#arrowStartCouplingT)" marker-end="url(#arrowEndCouplingT)"/>
  </g>
  <text x="50" y="280" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">W</text>
  <text x="115" y="178" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">L₂</text>

  <g font-size="11" fill="#555">
    <text x="20" y="522">Symmetric sectioned view. Female threads shown in section. ASME B16.11-2021, Tables 6.1-5 and 6.1-3, NPS 2, Class 3000.</text>
    <text x="20" y="540">D=76; W=86; B=19 min; L₂=19.2 min. Thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
