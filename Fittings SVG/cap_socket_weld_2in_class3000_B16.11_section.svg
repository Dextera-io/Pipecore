<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 socket-welding cap, sectioned view</title>
  <desc>NPS 2 Class 3000 socket-welding cap based on ASME B16.11-2021 Table 6.1-2. Uniform scale 3 px/mm. Outside diameter 79.4 mm, B 61.2 to 61.7 mm, C 6.93 mm average and 6.04 mm minimum, J 16 mm minimum, and K 12.7 mm minimum.</desc>

  <rect width="760" height="500" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="23" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Socket Weld Cap — ASME B16.11</text>

  <!-- J + K body length with small exterior chamfers. -->
  <path d="M 265.90,170
           L 494.10,170
           L 499.10,175
           L 499.10,251.10
           L 494.10,256.10
           L 265.90,256.10
           L 260.90,251.10
           L 260.90,175
           Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>

  <!-- Closed socket cavity B with its full bottom edge. -->
  <path d="M 287.83,170 L 472.18,170 L 472.18,218 L 287.83,218 Z"
        fill="white" stroke="black" stroke-width="1.75"/>
  <line x1="287.83" y1="218" x2="472.18" y2="218"
        stroke="black" stroke-width="1.75"/>

  <line x1="380" y1="145" x2="380" y2="281"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Top B and C dimensions. -->
  <g fill="none" stroke="black">
    <line x1="287.83" y1="170" x2="287.83" y2="118" stroke-width="0.75"/>
    <line x1="472.18" y1="170" x2="472.18" y2="118" stroke-width="0.75"/>
    <line x1="499.10" y1="175" x2="499.10" y2="118" stroke-width="0.75"/>
    <line x1="287.83" y1="125" x2="472.18" y2="125" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="472.18" y1="125" x2="499.10" y2="125" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="380" y="119" text-anchor="middle">B</text>
    <text x="505" y="119" text-anchor="start">C</text>
  </g>

  <!-- J and K outside. -->
  <g fill="none" stroke="black">
    <line x1="499.10" y1="170" x2="566" y2="170" stroke-width="0.75"/>
    <line x1="499.10" y1="218" x2="566" y2="218" stroke-width="0.75"/>
    <line x1="499.10" y1="256.10" x2="566" y2="256.10" stroke-width="0.75"/>
    <line x1="561" y1="170" x2="561" y2="218" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="561" y1="218" x2="561" y2="256.10" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="575" y="199">J</text>
    <text x="575" y="243">K</text>
  </g>

  <g font-size="11" fill="#555">
    <text x="20" y="464">Sectioned view. ASME B16.11-2021, Table 6.1-2, NPS 2, Class 3000. Geometric scale: 3 px/mm.</text>
    <text x="20" y="481">OD=79.4; B=61.2–61.7; C=6.93 avg./6.04 min; J=16 min; K=12.7 min. Dimensions in mm.</text>
  </g>
</svg>
