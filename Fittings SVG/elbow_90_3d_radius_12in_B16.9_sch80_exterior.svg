<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>12 inch ASME B16.9 Schedule 80 3D-radius 90-degree elbow</title>
  <desc>Exterior view of a proportional NPS 12 3D-radius 90-degree elbow based on ASME B16.9-2024 Table 6.1-6: outside diameter 323.8 mm and center-to-end dimension A=914 mm. Both ends use integrated Schedule 80 bevels. The curved edges are gray and the red centerline is the lightest part of the radial gradient.</desc>

  <rect x="0" y="0" width="760" height="353" fill="white"/>

  <defs>
    <radialGradient id="bodyFill" gradientUnits="userSpaceOnUse"
                    cx="190" cy="325" r="240" fx="190" fy="325">
      <stop offset="0" stop-color="#93a3b4"/>
      <stop offset="0.6991" stop-color="#93a3b4"/>
      <stop offset="0.76" stop-color="#cbd5df"/>
      <stop offset="0.815" stop-color="#eef2f6"/>
      <stop offset="0.8495" stop-color="#ffffff"/>
      <stop offset="0.89" stop-color="#eef2f6"/>
      <stop offset="0.945" stop-color="#cbd5df"/>
      <stop offset="1" stop-color="#93a3b4"/>
    </radialGradient>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="355" y="22" text-anchor="middle" font-size="17" font-weight="bold">12&quot; 90&#176; 3D Radius Elbow &#8212; ASME B16.9</text>

  <!-- Continuous exterior contour with integrated Schedule 80 bevels. -->
  <path d="M 190,88.54
           L 194.62,85
           A 240,240 0 0 1 430,320.38
           L 426.46,325
           L 361.32,325
           L 357.78,320.38
           A 167.78,167.78 0 0 0 194.62,157.22
           L 190,153.68
           Z"
        fill="url(#bodyFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Tangent construction centerlines. -->
  <line x1="155" y1="121.11" x2="470" y2="121.11" stroke="black" stroke-width="0.75"/>
  <line x1="393.89" y1="47" x2="393.89" y2="338" stroke="black" stroke-width="0.75"/>

  <!-- Elbow centerline. -->
  <path d="M 190,121.11 A 203.89,203.89 0 0 1 393.89,325"
        fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Horizontal center-to-end dimension A. -->
  <line x1="190" y1="88.54" x2="190" y2="65" stroke="black" stroke-width="0.75"/>
  <line x1="393.89" y1="121.11" x2="393.89" y2="65" stroke="black" stroke-width="0.75"/>
  <line x1="190" y1="65" x2="393.89" y2="65" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="291.95" y="60" text-anchor="middle" font-size="15" font-weight="bold">A</text>

  <!-- Vertical center-to-end dimension A. -->
  <line x1="393.89" y1="121.11" x2="482" y2="121.11" stroke="black" stroke-width="0.75"/>
  <line x1="426.46" y1="325" x2="482" y2="325" stroke="black" stroke-width="0.75"/>
  <line x1="482" y1="121.11" x2="482" y2="325" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="494" y="228" text-anchor="start" font-size="15" font-weight="bold">A</text>
</svg>
