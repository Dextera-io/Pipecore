<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 45-degree Sockolet, MSS SP-97</title>
  <desc>Exterior elevation of an NPS 2 Class 3000 45-degree socket-welding branch outlet fitting based on MSS SP-97-2025 Table 7. Dimension B is 0.62 inches minimum and dimension A ranges from 3.00 inches minimum to 3.31 inches maximum. The socket shoulder, hidden internal bore, and curved run-pipe saddle are shown.</desc>

  <rect width="760" height="353" fill="white"/>

  <defs>
    <linearGradient id="socket45BodyFill" gradientUnits="userSpaceOnUse" x1="235" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#b4bfca"/>
      <stop offset="0.25" stop-color="#dbe2e9"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="0.80" stop-color="#d3dbe3"/>
      <stop offset="1" stop-color="#a9b5c1"/>
    </linearGradient>
    <linearGradient id="socket45Fill" gradientUnits="userSpaceOnUse" x1="455" y1="120" x2="420" y2="195">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef2"/>
    </linearGradient>
    <linearGradient id="socket45SaddleFill" gradientUnits="userSpaceOnUse" x1="0" y1="248" x2="0" y2="301">
      <stop offset="0" stop-color="#dce3ea"/>
      <stop offset="1" stop-color="#8f9aa6"/>
    </linearGradient>
    <marker id="socket45ArrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="socket45ArrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="22" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 45&#176; Sockolet &#8212; MSS SP-97</text>

  <g transform="translate(0 12)">
    <!-- Forged 45-degree socket-welding outlet body. -->
    <path d="M235,248
             L320,155
             L405,85
             L520,200
             C525,216 520,233 505,248
             Q370,264 235,248 Z"
          fill="url(#socket45BodyFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- Lighter forward facet, consistent with the threaded outlet. -->
    <path d="M235,248
             L320,155
             L505,248
             Q370,264 235,248 Z"
          fill="#f7f9fb" fill-opacity="0.78" stroke="#747e88" stroke-width="0.85"
          stroke-linejoin="round"/>

    <!-- Visible socket recess and reduced bore at its shoulder. -->
    <path d="M434,115 L490,171
             L462,199 L455,192
             L413,150 L406,143 Z"
          fill="url(#socket45Fill)" stroke="#69737d" stroke-width="1.15"
          stroke-linejoin="round"/>

    <!-- Hidden continuation of the internal bore toward the run pipe. -->
    <line x1="413" y1="150" x2="336" y2="227"
          stroke="#7d8791" stroke-width="1.1" stroke-dasharray="7,5"/>
    <line x1="455" y1="192" x2="378" y2="269"
          stroke="#7d8791" stroke-width="1.1" stroke-dasharray="7,5"/>
    <line x1="336" y1="227" x2="378" y2="269"
          stroke="#7d8791" stroke-width="1.1" stroke-dasharray="7,5"/>

    <!-- Curved saddle that follows the run pipe. -->
    <path d="M235,248
             Q370,268 505,248
             L488,270
             Q370,301 252,270
             Z"
          fill="url(#socket45SaddleFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- Axis centered through the socket and fitting body. -->
    <line x1="280" y1="325" x2="515" y2="90"
          stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

    <!-- A: top of fitting to run pipe. -->
    <line x1="354" y1="35" x2="247" y2="142" stroke="black" stroke-width="1"
          marker-start="url(#socket45ArrowStart)" marker-end="url(#socket45ArrowEnd)"/>
    <line x1="354" y1="35" x2="462" y2="143" stroke="black" stroke-width="0.75"/>
    <line x1="247" y1="142" x2="355" y2="250" stroke="black" stroke-width="0.75"/>
    <text x="286" y="90" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">A</text>

    <!-- B minimum: socket depth. -->
    <line x1="547" y1="228" x2="519" y2="256" stroke="black" stroke-width="1"
          marker-start="url(#socket45ArrowStart)" marker-end="url(#socket45ArrowEnd)"/>
    <line x1="547" y1="228" x2="462" y2="143" stroke="black" stroke-width="0.75"/>
    <line x1="519" y1="256" x2="434" y2="171" stroke="black" stroke-width="0.75"/>
    <text x="560" y="247" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">B</text>
  </g>
</svg>
