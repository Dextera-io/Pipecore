<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" font-family="Arial, sans-serif">
  <title>2 inch threaded hex head plug</title>
  <desc>NPS 2 threaded hex head plug based on ASME B16.11-2021 Table 6.1-6. Side and top views at 3 px/mm. Minimum thread length A 22 mm, minimum hex head height H 18 mm, and nominal width across flats F 63.5 mm.</desc>

  <rect width="780" height="590" fill="white"/>
  <defs>
    <marker id="arrowStartHexPlug" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEndHexPlug" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <g id="maleThreadHexPlug">
      <path d="M-91,0 L91,0 L87,66 L-87,66 Z" fill="white" stroke="black" stroke-width="1.75"/>
      <g fill="none" stroke="black" stroke-width="1.15">
        <line x1="-91" y1="5" x2="91" y2="5"/>
        <line x1="-90.5" y1="11" x2="90.5" y2="11"/>
        <line x1="-90" y1="17" x2="90" y2="17"/>
        <line x1="-89.5" y1="23" x2="89.5" y2="23"/>
        <line x1="-89" y1="29" x2="89" y2="29"/>
        <line x1="-88.5" y1="35" x2="88.5" y2="35"/>
        <line x1="-88" y1="41" x2="88" y2="41"/>
        <line x1="-88" y1="47" x2="88" y2="47"/>
        <line x1="-87.5" y1="53" x2="87.5" y2="53"/>
        <line x1="-87.5" y1="59" x2="87.5" y2="59"/>
      </g>
      <path d="M-91,0 L-97,3 L-90.5,6 L-96.5,9 L-90,12 L-96,15 L-89.5,18
               L-95.5,21 L-89,24 L-95,27 L-88.5,30 L-95,33 L-88.5,36 L-94.5,39
               L-88,42 L-94,45 L-87.5,48 L-93.5,51 L-87.5,54 L-93,57
               L-87,60 L-87,66"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M91,0 L97,3 L90.5,6 L96.5,9 L90,12 L96,15 L89.5,18
               L95.5,21 L89,24 L95,27 L88.5,30 L95,33 L88.5,36 L94.5,39
               L88,42 L94,45 L87.5,48 L93.5,51 L87.5,54 L93,57
               L87,60 L87,66"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <text x="390" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded Hex Head Plug — ASME B16.11</text>

  <!-- Top view of hexagonal head, F=63.5 mm across flats. -->
  <path d="M280,145 L335,49.75 L445,49.75 L500,145 L445,240.25 L335,240.25 Z"
        fill="white" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
  <ellipse cx="390" cy="145" rx="95.25" ry="95.25"
           fill="none" stroke="#777" stroke-width="0.8"/>
  <line x1="260" y1="145" x2="520" y2="145"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  <line x1="390" y1="33" x2="390" y2="257"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- F dimension: vertical left-side, top flat to bottom flat (across flats). -->
  <g fill="none" stroke="black">
    <line x1="335" y1="49.75" x2="195" y2="49.75" stroke-width="0.75"/>
    <line x1="335" y1="240.25" x2="195" y2="240.25" stroke-width="0.75"/>
    <line x1="202" y1="49.75" x2="202" y2="240.25" stroke-width="1"
          marker-start="url(#arrowStartHexPlug)" marker-end="url(#arrowEndHexPlug)"/>
  </g>
  <text x="192" y="150" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">F</text>

  <!-- Side view of hex head: H=18 mm. -->
  <path d="M306,299 Q295,299 295,307 L295,345 Q295,353 306,353
           L474,353 Q485,353 485,345 L485,307 Q485,299 474,299 Z"
        fill="white" stroke="black" stroke-width="1.75"/>
  <path d="M326,299 L326,353 M454,299 L454,353
           M326,299 Q390,287 454,299 M326,353 Q390,365 454,353"
        fill="none" stroke="black" stroke-width="1"/>

  <use href="#maleThreadHexPlug" transform="translate(390 353)"/>

  <line x1="390" y1="274" x2="390" y2="439"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- H and A at left. -->
  <g fill="none" stroke="black">
    <line x1="295" y1="299" x2="195" y2="299" stroke-width="0.75"/>
    <line x1="295" y1="353" x2="195" y2="353" stroke-width="0.75"/>
    <line x1="202" y1="299" x2="202" y2="353" stroke-width="1"
          marker-start="url(#arrowStartHexPlug)" marker-end="url(#arrowEndHexPlug)"/>

    <line x1="299" y1="353" x2="195" y2="353" stroke-width="0.75"/>
    <line x1="299" y1="419" x2="195" y2="419" stroke-width="0.75"/>
    <line x1="202" y1="353" x2="202" y2="419" stroke-width="1"
          marker-start="url(#arrowStartHexPlug)" marker-end="url(#arrowEndHexPlug)"/>
  </g>
  <text x="192" y="330" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">H</text>
  <text x="192" y="391" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">A</text>

  <g font-size="11" fill="#555">
    <text x="20" y="552">Top and exterior views. ASME B16.11-2021, Table 6.1-6, NPS 2. Geometric scale: 3 px/mm.</text>
    <text x="20" y="570">A=22 min; H=18 min; F=63.5 nominal across flats. Male thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
