<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 socket-welding cross, sectioned view</title>
  <desc>Symmetrical NPS 2 Class 3000 socket-welding cross based on ASME B16.11-2021 Table 6.1-1. Uniform scale 3 px/mm. A 38 mm minimum, B 61.2 to 61.7 mm, C 6.93 mm average and 6.04 mm minimum, D 51.7 to 53.3 mm, G 5.54 mm minimum, and J 16 mm minimum.</desc>

  <rect width="760" height="520" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="23" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Socket Weld Cross — ASME B16.11</text>

  <!-- Four identical socket bodies. Scale: 3 px/mm. -->
  <path d="M 267.04,138 L 492.97,138 L 492.97,186 L 267.04,186 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>
  <path d="M 267.04,414 L 492.97,414 L 492.97,462 L 267.04,462 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>
  <path d="M 218,187.04 L 266,187.04 L 266,412.97 L 218,412.97 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>
  <path d="M 494,187.04 L 542,187.04 L 542,412.97 L 494,412.97 Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75"/>

  <!--
    Robust cross body. G is a tabulated minimum, so the displayed body is
    intentionally thicker while B, C, D, J, and A remain at the common scale.
  -->
  <path d="M 380,186 L 380,414 M 266,300 L 494,300"
        fill="none" stroke="black" stroke-width="229.93" stroke-linecap="butt"/>
  <path d="M 380,186 L 380,414 M 266,300 L 494,300"
        fill="none" stroke="url(#hatch)" stroke-width="225.93" stroke-linecap="butt"/>

  <!-- Continuous cross bore D with rounded internal corners. -->
  <path d="M 301.25,186
           L 458.75,186
           L 458.75,209.25
           Q 458.75,221.25 470.75,221.25
           L 494,221.25
           L 494,378.75
           L 470.75,378.75
           Q 458.75,378.75 458.75,390.75
           L 458.75,414
           L 301.25,414
           L 301.25,390.75
           Q 301.25,378.75 289.25,378.75
           L 266,378.75
           L 266,221.25
           L 289.25,221.25
           Q 301.25,221.25 301.25,209.25
           Z"
        fill="white" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Socket cavities B. -->
  <path d="M 287.83,138 L 472.18,138 L 472.18,186 L 287.83,186 Z"
        fill="white" stroke="black" stroke-width="1.5"/>
  <path d="M 287.83,414 L 472.18,414 L 472.18,462 L 287.83,462 Z"
        fill="white" stroke="black" stroke-width="1.5"/>
  <path d="M 218,207.83 L 266,207.83 L 266,392.18 L 218,392.18 Z"
        fill="white" stroke="black" stroke-width="1.5"/>
  <path d="M 494,207.83 L 542,207.83 L 542,392.18 L 494,392.18 Z"
        fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Remove construction seams between contiguous socket and body material. -->
  <g stroke="url(#hatch)" stroke-width="4">
    <line x1="267.04" y1="186" x2="287.83" y2="186"/>
    <line x1="472.18" y1="186" x2="492.97" y2="186"/>
    <line x1="267.04" y1="414" x2="287.83" y2="414"/>
    <line x1="472.18" y1="414" x2="492.97" y2="414"/>
    <line x1="266" y1="187.04" x2="266" y2="207.83"/>
    <line x1="266" y1="392.18" x2="266" y2="412.97"/>
    <line x1="494" y1="187.04" x2="494" y2="207.83"/>
    <line x1="494" y1="392.18" x2="494" y2="412.97"/>
  </g>

  <!-- Four symmetrical socket stops, B to D. -->
  <g stroke="black" stroke-width="1.75">
    <line x1="287.83" y1="186" x2="301.25" y2="186"/>
    <line x1="458.75" y1="186" x2="472.18" y2="186"/>
    <line x1="287.83" y1="414" x2="301.25" y2="414"/>
    <line x1="458.75" y1="414" x2="472.18" y2="414"/>
    <line x1="266" y1="207.83" x2="266" y2="221.25"/>
    <line x1="266" y1="378.75" x2="266" y2="392.18"/>
    <line x1="494" y1="207.83" x2="494" y2="221.25"/>
    <line x1="494" y1="378.75" x2="494" y2="392.18"/>
  </g>

  <!-- Centerlines. -->
  <path d="M 380,120 L 380,475 M 200,300 L 560,300"
        fill="none" stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Top B, C, and D dimensions. -->
  <g fill="none" stroke="black">
    <line x1="267.04" y1="138" x2="267.04" y2="75" stroke-width="0.75"/>
    <line x1="287.83" y1="138" x2="287.83" y2="75" stroke-width="0.75"/>
    <line x1="472.18" y1="138" x2="472.18" y2="75" stroke-width="0.75"/>
    <line x1="301.25" y1="186" x2="301.25" y2="106" stroke-width="0.75"/>
    <line x1="458.75" y1="186" x2="458.75" y2="106" stroke-width="0.75"/>

    <line x1="267.04" y1="82" x2="287.83" y2="82" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="287.83" y1="82" x2="472.18" y2="82" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="301.25" y1="113" x2="458.75" y2="113" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="263" y="76" text-anchor="end">C</text>
    <text x="380" y="76" text-anchor="middle">B</text>
    <text x="380" y="107" text-anchor="middle">D</text>
  </g>

  <!-- J and A at the left. -->
  <g fill="none" stroke="black">
    <line x1="267.04" y1="138" x2="105" y2="138" stroke-width="0.75"/>
    <line x1="266" y1="186" x2="105" y2="186" stroke-width="0.75"/>
    <line x1="266" y1="300" x2="105" y2="300" stroke-width="0.75"/>
    <line x1="110" y1="138" x2="110" y2="186" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="110" y1="186" x2="110" y2="300" stroke-width="1"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g font-size="15" font-style="italic" font-weight="bold">
    <text x="118" y="167" text-anchor="start">J</text>
    <text x="118" y="250" text-anchor="start">A</text>
  </g>

  <g font-size="11" fill="#555">
    <text x="20" y="489">Symmetric sectioned view. ASME B16.11-2021, Table 6.1-1, NPS 2, Class 3000. Geometric scale: 3 px/mm.</text>
    <text x="20" y="506">A=38 min (±2); B=61.2–61.7; C=6.93 avg./6.04 min; D=51.7–53.3; G=5.54 min; J=16 min. Dimensions in mm.</text>
  </g>
</svg>
