<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 socket-welding 90-degree elbow, sectioned view</title>
  <desc>Schematic section based on the ASME B16.11 socket-welding elbow figure. NPS 2 Class 3000 dimensions from Table 6.1-1: A 38 mm minimum, B 61.2 to 61.7 mm, C 6.93 mm average and 6.04 mm minimum, D 51.7 to 53.3 mm, G 5.54 mm minimum, J 16 mm minimum, and A tolerance plus or minus 2 mm.</desc>

  <rect width="760" height="500" fill="white"/>

  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="23" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Socket Weld 90° Elbow — ASME B16.11</text>

  <!-- Dimension construction follows the supplied reference figure. -->
  <g fill="none" stroke="black" stroke-width="0.75">
    <line x1="247.04" y1="118" x2="247.04" y2="50"/>
    <line x1="267.83" y1="118" x2="267.83" y2="50"/>
    <line x1="452.18" y1="118" x2="452.18" y2="50"/>
    <line x1="281.25" y1="166" x2="281.25" y2="83"/>
    <line x1="438.75" y1="166" x2="438.75" y2="83"/>

    <line x1="247.04" y1="118" x2="102" y2="118"/>
    <line x1="264.63" y1="166" x2="102" y2="166"/>
    <line x1="281.25" y1="280" x2="102" y2="280"/>

    <line x1="281.25" y1="358.75" x2="148" y2="358.75"/>
    <line x1="360" y1="375.37" x2="148" y2="375.37"/>

  </g>

  <!-- Uniform drawing scale: 3 px/mm. B and D use the midpoint of their ASME limit ranges. -->
  <path d="M 247.04,118
           L 472.97,118
           L 472.97,142
           C 472.97,156 484,167.04 497,167.04
           L 522,167.04
           L 522,392.97
           L 497,392.97
           C 490,381 481,375.37 470,375.37
           L 360,375.37
           C 307.32,375.37 264.63,332.68 264.63,280
           L 264.63,188
           C 264.63,178 259,171 252,165
           C 247,160 245,152 247.04,145
           Z"
        fill="url(#hatch)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Top socket cavity. -->
  <path d="M 267.83,118 L 452.18,118 L 452.18,166 L 267.83,166 Z"
        fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Continuous internal passage with the short-radius elbow shape. -->
  <path d="M 281.25,166
           L 438.75,166
           L 438.75,201.25
           L 474,201.25
           L 474,358.75
           L 360,358.75
           C 316.50,358.75 281.25,323.50 281.25,280
           L 281.25,166
           Z"
        fill="white" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Right socket cavity and end face. -->
  <path d="M 474,187.83 L 522,187.83 L 522,372.18 L 474,372.18 Z"
        fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Socket-bottom shoulders, emphasized as in the reference. -->
  <line x1="267.83" y1="166" x2="281.25" y2="166" stroke="black" stroke-width="1.5"/>
  <line x1="438.75" y1="166" x2="452.18" y2="166" stroke="black" stroke-width="1.5"/>
  <line x1="474" y1="187.83" x2="474" y2="201.25" stroke="black" stroke-width="1.5"/>
  <line x1="474" y1="358.75" x2="474" y2="372.18" stroke="black" stroke-width="1.5"/>

  <!-- Centerlines copied from the visual convention of the supplied figure. -->
  <line x1="360" y1="94" x2="360" y2="280"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  <line x1="281.25" y1="280" x2="522" y2="280"
        stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Dimension arrows. -->
  <g fill="none" stroke="black" stroke-width="1">
    <line x1="247.04" y1="57" x2="267.83" y2="57"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="267.83" y1="57" x2="452.18" y2="57"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="281.25" y1="90" x2="438.75" y2="90"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>

    <line x1="107" y1="118" x2="107" y2="166"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="107" y1="166" x2="107" y2="280"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="153" y1="358.75" x2="153" y2="375.37"
          marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>

  </g>

  <g font-size="15" font-style="italic" font-weight="bold" fill="black">
    <text x="243" y="51" text-anchor="end">C</text>
    <text x="360" y="51" text-anchor="middle">B</text>
    <text x="360" y="84" text-anchor="middle">D</text>
    <text x="115" y="146" text-anchor="start">J</text>
    <text x="115" y="230" text-anchor="start">A</text>
    <text x="165" y="372" text-anchor="start">G</text>
  </g>

  <g font-size="11" fill="#555">
    <text x="20" y="464">Schematic sectioned view based on supplied figure. ASME B16.11-2021, Table 6.1-1, NPS 2, Class 3000.</text>
    <text x="20" y="481">A=38 min (±2); B=61.2–61.7; C=6.93 prom./6.04 min; D=51.7–53.3; G=5.54 min; J=16 min. Dimensions in mm.</text>
  </g>
</svg>
