<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="Arial, sans-serif">
  <title>2 inch Class 3000 threaded 45-degree elbow, sectioned view</title>
  <desc>Symmetrical sectioned NPS 2 Class 3000 threaded 45-degree elbow based on ASME B16.11-2021 Table 6.1-3. Dimensions: C 44 mm minimum, H 84 mm minimum, G 7.14 mm minimum, B 19 mm minimum, and L2 19.2 mm minimum.</desc>

  <rect width="760" height="600" fill="white"/>

  <defs>
    <pattern id="hatch45t" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <pattern id="hatch45tDiagonalBand" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect width="7" height="7" fill="white"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrowStart45t" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd45t" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <clipPath id="rightHalf45t">
      <rect x="360" y="0" width="400" height="600"/>
    </clipPath>

    <!-- Female tapered thread, open face at y=0 and fitting interior toward +y. -->
    <g id="femaleThread45t">
      <path d="M-90.5,0 L90.5,0 L84,58 L-84,58 Z" fill="white"/>
      <path d="M-90.5,0
               L-90,4 L-84,8 L-89,12 L-83,16 L-88,20 L-82,24
               L-87,28 L-81,32 L-86,36 L-80,40 L-85,44 L-79,48
               L-84,52 L-84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M90.5,0
               L90,4 L84,8 L89,12 L83,16 L88,20 L82,24
               L87,28 L81,32 L86,36 L80,40 L85,44 L79,48
               L84,52 L84,58"
            fill="none" stroke="black" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="-90.5" y1="0" x2="90.5" y2="0" stroke="black" stroke-width="1.5"/>
      <line x1="-84" y1="58" x2="-69" y2="58" stroke="black" stroke-width="1.5"/>
      <line x1="69" y1="58" x2="84" y2="58" stroke="black" stroke-width="1.5"/>
    </g>

    <!-- Wide threaded band that narrows toward the elbow body. -->
    <g id="outerBand45t">
      <path d="M-126,0 L126,0 L126,58
               C126,70 116,80 105,80
               L-105,80
               C-116,80 -126,70 -126,58 Z"
            fill="url(#hatch45t)"/>
      <path d="M-105,80
               C-116,80 -126,70 -126,58
               L-126,0 L126,0 L126,58
               C126,70 116,80 105,80"
            fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
    </g>
    <g id="outerBand45tDiagonal">
      <path d="M-126,0 L126,0 L126,58
               C126,70 116,80 105,80
               L-105,80
               C-116,80 -126,70 -126,58 Z"
            fill="url(#hatch45tDiagonalBand)"/>
      <path d="M-105,80
               C-116,80 -126,70 -126,58
               L-126,0 L126,0 L126,58
               C126,70 116,80 105,80"
            fill="none" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>
    </g>
  </defs>

  <text x="380" y="25" text-anchor="middle" font-size="17" font-weight="bold">2&quot; Class 3000 Threaded 45° Elbow — ASME B16.11</text>

  <!-- Narrow central elbow body with full-diameter threaded bands at both ends. -->
  <path d="M360,380 L360,318 L403.84,274.16"
        fill="none" stroke="black" stroke-width="210" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M360,380 L360,318 L403.84,274.16"
        fill="none" stroke="url(#hatch45t)" stroke-width="206" stroke-linecap="butt" stroke-linejoin="round"/>
  <use href="#outerBand45t" transform="translate(360 450) rotate(180)"/>
  <use href="#outerBand45tDiagonal" transform="translate(453.34 224.66) rotate(45)"/>

  <!-- Restore the original full exterior profile only on the right half. -->
  <g clip-path="url(#rightHalf45t)">
    <path d="M360,450 L360,318 L453.34,224.66"
          fill="none" stroke="black" stroke-width="254" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M360,450 L360,318 L453.34,224.66"
          fill="none" stroke="url(#hatch45t)" stroke-width="250" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>

  <!-- Continuous internal flow passage. -->
  <path d="M360,392 L360,318 L412.33,265.67"
        fill="none" stroke="black" stroke-width="142" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M360,392 L360,318 L412.33,265.67"
        fill="none" stroke="white" stroke-width="138" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Female threaded ends. -->
  <use href="#femaleThread45t" transform="translate(360 450) rotate(180)"/>
  <use href="#femaleThread45t" transform="translate(453.34 224.66) rotate(45)"/>

  <!-- Centerline. -->
  <path d="M360,478 L360,318 L473,205"
        fill="none" stroke="#555" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Center-to-end C along the diagonal axis. -->
  <g fill="none" stroke="black">
    <line x1="453.34" y1="224.66" x2="343.34" y2="114.66" stroke-width="0.75"/>
    <line x1="360" y1="318" x2="250" y2="208" stroke-width="0.75"/>
    <line x1="343.34" y1="114.66" x2="250" y2="208" stroke-width="1"
          marker-start="url(#arrowStart45t)" marker-end="url(#arrowEnd45t)"/>
  </g>
  <text x="265" y="128" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">C</text>

  <!-- H across the lower band. -->
  <g fill="none" stroke="black">
    <line x1="234" y1="450" x2="234" y2="507" stroke-width="0.75"/>
    <line x1="486" y1="450" x2="486" y2="507" stroke-width="0.75"/>
    <line x1="234" y1="500" x2="486" y2="500" stroke-width="1"
          marker-start="url(#arrowStart45t)" marker-end="url(#arrowEnd45t)"/>
  </g>
  <text x="360" y="493" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold">H</text>

  <!-- Thread engagement length L2 at the lower end. -->
  <g fill="none" stroke="black">
    <line x1="270" y1="450" x2="102" y2="450" stroke-width="0.75"/>
    <line x1="276" y1="392.4" x2="102" y2="392.4" stroke-width="0.75"/>
    <line x1="109" y1="450" x2="109" y2="392.4" stroke-width="1"
          marker-start="url(#arrowStart45t)" marker-end="url(#arrowEnd45t)"/>
  </g>
  <text x="115" y="426" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">L₂</text>

  <!-- Minimum body wall G. -->
  <g fill="none" stroke="black">
    <line x1="144" y1="278" x2="258" y2="308" stroke-width="1"
          marker-end="url(#arrowEnd45t)"/>
  </g>
  <text x="134" y="278" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">G</text>

  <g font-size="11" fill="#555">
    <text x="20" y="562">Schematic sectioned view. Female threads shown in section. ASME B16.11-2021, Table 6.1-3, NPS 2, Class 3000.</text>
    <text x="20" y="580">C=44 min; H=84 min; G=7.14 min; B=19 min; L₂=19.2 min. Thread per ASME B1.20.1. Dimensions in mm.</text>
  </g>
</svg>
