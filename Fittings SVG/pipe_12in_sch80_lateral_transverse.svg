<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>12 inch Schedule 80 pipe, transverse and lateral views</title>
  <desc>Two coordinated views of an NPS 12 Schedule 80 pipe in one image. ASME B36.10M dimensions are outside diameter D=323.8 mm, nominal wall thickness t=17.48 mm, and plain-end mass 132.04 kg/m or 88.71 lb/ft. The illustrated lateral length is arbitrary.</desc>

  <rect x="0" y="0" width="760" height="353" fill="white"/>

  <defs>
    <linearGradient id="sideFill" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="270">
      <stop offset="0" stop-color="#aebbc9"/>
      <stop offset="0.22" stop-color="#d9e1e9"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#d9e1e9"/>
      <stop offset="1" stop-color="#aebbc9"/>
    </linearGradient>
    <radialGradient id="endFill" gradientUnits="userSpaceOnUse" cx="185" cy="180" r="90">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.84" stop-color="#f8fafc"/>
      <stop offset="0.90" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#aebbc9"/>
    </radialGradient>
    <mask id="pipeRing">
      <rect x="0" y="0" width="760" height="353" fill="black"/>
      <circle cx="185" cy="180" r="90" fill="white"/>
      <circle cx="185" cy="180" r="80.28" fill="black"/>
    </mask>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="arrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
    <marker id="leaderArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="22" text-anchor="middle" font-size="17" font-weight="bold">12&quot; Sch 80 Pipe &#8212; Transverse and Lateral Views</text>

  <!-- Transverse view on the left. The annulus preserves the real Sch 80 thickness-to-diameter ratio. -->
  <rect x="95" y="90" width="180" height="180" fill="url(#endFill)" mask="url(#pipeRing)"/>
  <circle cx="185" cy="180" r="90" fill="none" stroke="black" stroke-width="1.75"/>
  <circle cx="185" cy="180" r="80.28" fill="white" stroke="black" stroke-width="1.75"/>
  <line x1="75" y1="180" x2="295" y2="180"
        stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  <line x1="185" y1="70" x2="185" y2="290"
        stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- D: outside diameter. -->
  <line x1="185" y1="90" x2="325" y2="90" stroke="black" stroke-width="0.75"/>
  <line x1="185" y1="270" x2="325" y2="270" stroke="black" stroke-width="0.75"/>
  <line x1="315" y1="90" x2="315" y2="270" stroke="black" stroke-width="1"
        marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="327" y="185" text-anchor="start" font-size="15" font-weight="bold">D</text>

  <!-- t: nominal Schedule 80 wall thickness. -->
  <line x1="282" y1="104" x2="245.15" y2="119.85" stroke="black" stroke-width="1"
        marker-end="url(#leaderArrow)"/>
  <text x="287" y="100" text-anchor="start" font-size="15" font-style="italic" font-weight="bold">t</text>

  <!-- Lateral exterior view on the right. Its length is illustrative. -->
  <rect x="390" y="90" width="300" height="180"
        fill="url(#sideFill)" stroke="black" stroke-width="1.75"/>
  <line x1="370" y1="180" x2="710" y2="180"
        stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>

  <!-- Plain-end mass per unit length from ASME B36.10M. -->
  <line x1="390" y1="270" x2="390" y2="321" stroke="black" stroke-width="0.75"/>
  <line x1="690" y1="270" x2="690" y2="321" stroke="black" stroke-width="0.75"/>
  <line x1="390" y1="312" x2="690" y2="312" stroke="black" stroke-width="1"/>
  <text x="540" y="306" text-anchor="middle" font-size="14" font-weight="bold">W = 132.04 kg/m  (88.71 lb/ft)</text>

  <!-- View names aligned at the same height below the mass reference. -->
  <text x="185" y="342" text-anchor="middle" font-size="15" font-weight="bold">Transverse View</text>
  <text x="540" y="342" text-anchor="middle" font-size="15" font-weight="bold">Lateral View</text>
</svg>
