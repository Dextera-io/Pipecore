<svg xmlns="http://www.w3.org/2000/svg" width="760" height="353" viewBox="0 0 760 353" font-family="Arial, sans-serif">
  <title>3 inch Class 3000 Sockolet, MSS SP-97</title>
  <desc>Exterior elevation of an NPS 3 Class 3000 90-degree socket-welding branch outlet fitting based on MSS SP-97-2025 Table 4. Dimension B is 0.62 inches minimum and dimension C is 1.19 inches maximum. The socket bore and concave saddle surface are shown.</desc>

  <rect width="760" height="353" fill="white"/>

  <defs>
    <linearGradient id="socketBodyFill" gradientUnits="userSpaceOnUse" x1="235" y1="0" x2="525" y2="0">
      <stop offset="0" stop-color="#b5c0cc"/>
      <stop offset="0.22" stop-color="#dce3ea"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#dce3ea"/>
      <stop offset="1" stop-color="#b5c0cc"/>
    </linearGradient>
    <linearGradient id="socketSaddleFill" gradientUnits="userSpaceOnUse" x1="0" y1="245" x2="0" y2="275">
      <stop offset="0" stop-color="#d9e0e7"/>
      <stop offset="1" stop-color="#8f9aa6"/>
    </linearGradient>
    <marker id="socketArrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L9,6 L0,3 z" fill="black"/>
    </marker>
    <marker id="socketArrowEnd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="black"/>
    </marker>
  </defs>

  <text x="380" y="22" text-anchor="middle" font-size="17" font-weight="bold">3&quot; Class 3000 Sockolet &#8212; MSS SP-97</text>

  <g transform="translate(0 13)">
    <!-- Dimension lines are placed behind the fitting. -->
    <line x1="130" y1="75" x2="285" y2="75" stroke="black" stroke-width="0.75"/>
    <line x1="130" y1="135" x2="320" y2="135" stroke="black" stroke-width="0.75"/>
    <line x1="140" y1="75" x2="140" y2="135" stroke="black" stroke-width="1"
          marker-start="url(#socketArrowStart)" marker-end="url(#socketArrowEnd)"/>
    <line x1="140" y1="135" x2="140" y2="250" stroke="black" stroke-width="1"
          marker-start="url(#socketArrowStart)" marker-end="url(#socketArrowEnd)"/>
    <text x="117" y="109" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">B</text>
    <text x="117" y="198" text-anchor="end" font-size="15" font-style="italic" font-weight="bold">C</text>

    <path d="M285,75 L475,75 L525,245 Q380,232 235,245 Z"
          fill="url(#socketBodyFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

    <path d="M235,245 Q380,232 525,245
             L510,272 Q380,228 250,272 Z"
          fill="url(#socketSaddleFill)" stroke="black" stroke-width="1.75" stroke-linejoin="round"/>

    <!-- Lower extension of C remains visible up to the fitting axis. -->
    <line x1="130" y1="250" x2="380" y2="250" stroke="black" stroke-width="0.75"/>

    <!-- Socket cavity and its hidden continuation below the shoulder. -->
    <path d="M320,75 L440,75 L440,135 L320,135 Z"
          fill="white" stroke="#666f78" stroke-width="1.2"/>
    <line x1="320" y1="135" x2="320" y2="170" stroke="#7f8790" stroke-width="1"
          stroke-dasharray="6,5"/>
    <line x1="440" y1="135" x2="440" y2="170" stroke="#7f8790" stroke-width="1"
          stroke-dasharray="6,5"/>

    <line x1="380" y1="42" x2="380" y2="313"
          stroke="#c0392b" stroke-width="1" stroke-dasharray="14,4,2,4"/>
  </g>
</svg>
